/* ---- embedded mini-grid detection (e.g. 등급/점수 conversion tables) ---- */
function tokenize(line){ return line.split(/\s+/).filter(Boolean); }
function isValueToken(t){ return /[0-9]/.test(t) || /^[A-E]$/.test(t); }

function splitGridBlocks(lines){
  const blocks = [];
  let i = 0;
  const BULLET_PREFIX = /^[•·\-–※【]/;
  while(i < lines.length){
    const tokens = tokenize(lines[i]);
    if(tokens.length >= 3 && !BULLET_PREFIX.test(lines[i])){
      let j = i + 1;
      while(j < lines.length){
        const t2 = tokenize(lines[j]);
        if(t2.length !== tokens.length) break;
        const rest = t2.slice(1);
        const ratio = rest.length ? rest.filter(isValueToken).length / rest.length : 0;
        if(ratio < 0.6) break;
        j++;
      }
      const runLen = j - i;
      if(runLen >= 2){
        blocks.push({ type: "grid", rows: lines.slice(i, j).map(tokenize) });
        i = j;
        continue;
      }
    }
    blocks.push({ type: "line", text: lines[i] });
    i++;
  }
  return blocks;
}

function renderMiniGrid(rows){
  const rowsHtml = rows.map((r) => {
    const cellsHtml = r.map((cell, ci) =>
      `<td class="${ci===0 ? 'mg-label' : 'mg-val'}">${esc(cell)}</td>`
    ).join("");
    return `<tr>${cellsHtml}</tr>`;
  }).join("");
  return `<div class="mini-grid-wrap"><table class="mini-grid">${rowsHtml}</table></div>`;
}

function renderSubTable(rows){
  if(!rows || rows.length === 0) return "";
  const header = rows[0];
  const body = rows.slice(1);
  const headHtml = `<tr>${header.map(h=>`<th>${escHL(h)}</th>`).join("")}</tr>`;
  const bodyHtml = body.map(r => `<tr>${r.map((c,ci)=>`<td class="${ci===0?'st-label':'st-val'}">${escHL(c)}</td>`).join("")}</tr>`).join("");
  return `<div class="sub-table-wrap"><table class="sub-table"><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table></div>`;
}

/* ---- content line rendering ---- */
function renderCellLines(text){
  if(!text) return "";
  if(text.startsWith(SUBTABLE_MARK)){
    try{
      const rows = JSON.parse(text.slice(SUBTABLE_MARK.length));
      return renderSubTable(rows);
    }catch(e){ /* fall through to normal rendering */ }
  }
  const lines = text.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const blocks = splitGridBlocks(lines);
  return blocks.map(block => {
    if(block.type === "grid"){
      return renderMiniGrid(block.rows);
    }
    const line = block.text;
    const plain = stripMarkers(line);
    const e = escHL(line);
    if(/^【.*】/.test(plain)){
      return `<div class="cline tag">${e}</div>`;
    }
    if(plain.startsWith("※")){
      return `<div class="cline warn">${e}</div>`;
    }
    if(plain.startsWith("•")){
      return `<div class="cline bullet">${escHL(line.replace(/^•\s*/,""))}</div>`;
    }
    if(plain.startsWith("-") || plain.startsWith("–")){
      return `<div class="cline sub">${escHL(line.replace(/^[-–]\s*/,""))}</div>`;
    }
    return `<div class="cline">${e}</div>`;
  }).join("");
}

function renderTable(rows, hasHeader){
  if(!rows || rows.length === 0) return "";
  const header = rows[0];
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const ncols = header.length;
  const colsClass = ncols >= 3 ? "cols-3" : "cols-2";

  let headerHtml = "";
  if(hasHeader){
    if(ncols >= 3){
      headerHtml = `<div class="col-header">
        <span>${escHL(header[0])}</span><span>${escHL(header[1])}</span><span>${escHL(header[2]||'')}</span>
      </div>`;
    } else {
      headerHtml = `<div class="col-header"><span>${escHL(header[0])}</span><span>${escHL(header[1]||'')}</span></div>`;
    }
  }

  const rowsHtml = dataRows.map((r,i) => {
    const label = r[0] || "";
    const content = r[1] || "";
    const note = r[2] || "";
    if(ncols >= 3){
      return `
        <div class="info-row ${i%2===1?'shaded':''}">
          <div class="cell-label"><span class="chip">${escHL(label)}</span></div>
          <div class="cell-content">${renderCellLines(content)}</div>
          <div class="cell-note">${renderCellLines(note)}</div>
        </div>`;
    } else {
      return `
        <div class="info-row ${i%2===1?'shaded':''}">
          <div class="cell-label"><span class="chip">${escHL(label)}</span></div>
          <div class="cell-content">${renderCellLines(content)}</div>
        </div>`;
    }
  }).join("");

  return `<div class="info-table ${colsClass}">${headerHtml}${rowsHtml}</div>`;
}

function renderSection(s){
  const blocksHtml = s.blocks.map(b => {
    if(b.type === "table"){
      return renderTable(b.rows, b.hasHeader);
    } else {
      const plain = stripMarkers(b.text).trim();
      const isDisclaimer = plain.startsWith("※");
      const shown = isDisclaimer ? b.text.replace(/^\s*※\s*/,"") : b.text;
      return `<div class="note-block ${isDisclaimer?'disclaimer':''}">${escHL(shown)}</div>`;
    }
  }).join("");

  const headingHtml = s.title ? `
    <div class="section-heading">
      <div class="num-badge">${esc(s.num)}</div>
      <h3 class="font-display">${escHL(s.title)}</h3>
    </div>` : "";

  return `<div class="section-block" id="sec-${s.num}" data-sec="${s.num}">${headingHtml}${blocksHtml}</div>`;
}

function renderMain(){
  const u = DATA.find(x => x.id === state.selectedId);
  if(!u){ renderEmptyMain(); return; }

  const pillsHtml = u.sections.length > 1 ? `
    <div class="section-pills">
      ${u.sections.map(s=>`<button class="section-pill" data-sec="${s.num}"><span class="num">${esc(s.num)}</span>${escHL(stripMarkers(s.title).length>16? stripMarkers(s.title).slice(0,16)+'…' : s.title)}</button>`).join("")}
    </div>
  ` : "";

  const bodyHtml = u.sections.map(renderSection).join("");
  const trailingHtml = (u.trailingNotes||[]).map(t=>`<div class="note-block">${escHL(t)}</div>`).join("");

  el("#mainInner").innerHTML = `
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M4 17H20" stroke="#3D4852" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="info">
        <div class="title-row">
          <h2 class="font-display">${esc(u.name)}</h2>
          <span class="badge">${esc(u.region)}</span>
        </div>
        <div class="sub">${esc(u.categoryLabel)} · 원문 ${esc(u.pageRange)}쪽</div>
      </div>
      <button class="icon-btn" id="prevUnivBtn" title="이전 대학">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="#3D4852" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="nextUnivBtn" title="다음 대학">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="#3D4852" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    ${pillsHtml}
    <div class="viewer-scroll" id="viewerScroll">
      <div class="content-wrap">
        ${trailingHtml}
        ${bodyHtml}
      </div>
    </div>
  `;

  el("#hamburgerBtn")?.addEventListener("click", openSidebarMobile);
  els(".section-pill").forEach(b => b.addEventListener("click", () => {
    const target = document.getElementById(`sec-${b.dataset.sec}`);
    if(target){
      els(".section-pill").forEach(p => p.classList.toggle("active", p === b));
      target.scrollIntoView({behavior:"smooth", block:"start"});
    }
  }));

  const currentList = filteredList();
  const pos = currentList.findIndex(x => x.id === u.id);
  const prevU = pos > 0 ? currentList[pos-1] : null;
  const nextU = pos < currentList.length-1 ? currentList[pos+1] : null;
  const prevBtn = el("#prevUnivBtn"), nextBtn = el("#nextUnivBtn");
  if(prevU) prevBtn.addEventListener("click", ()=>selectUniv(prevU.id)); else prevBtn.disabled = true;
  if(nextU) nextBtn.addEventListener("click", ()=>selectUniv(nextU.id)); else nextBtn.disabled = true;

  const scrollEl = el("#viewerScroll");
  scrollEl.scrollTop = 0;
  const secBlocks = els(".section-block");
  if(secBlocks.length > 1 && scrollEl){
    const setActive = (sec) => {
      els(".section-pill").forEach(p => p.classList.toggle("active", p.dataset.sec === sec));
    };
    const updateActiveSection = () => {
      const containerTop = scrollEl.getBoundingClientRect().top;
      const offset = 24; // small buffer from top of the scroll area
      let current = secBlocks[0];
      for(const block of secBlocks){
        const top = block.getBoundingClientRect().top - containerTop;
        if(top <= offset){
          current = block;
        } else {
          break;
        }
      }
      setActive(current.dataset.sec);
    };
    let ticking = false;
    scrollEl.addEventListener("scroll", () => {
      if(!ticking){
        window.requestAnimationFrame(() => { updateActiveSection(); ticking = false; });
        ticking = true;
      }
    });
    updateActiveSection();
  } else if(secBlocks.length === 1){
    els(".section-pill").forEach(p => p.classList.toggle("active", p.dataset.sec === secBlocks[0].dataset.sec));
  }
}

function openSidebarMobile(){ el("#sidebar").classList.add("open"); el("#scrim").classList.add("open"); }
function closeSidebarMobile(){ el("#sidebar").classList.remove("open"); el("#scrim").classList.remove("open"); }
el("#scrim").addEventListener("click", closeSidebarMobile);

el("#searchInput").addEventListener("input", (e)=>{
  state.query = e.target.value;
  renderList();
});

renderChips();
renderList();
renderEmptyMain();
</script>
