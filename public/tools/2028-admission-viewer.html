<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2028 대학 입학전형 시행계획 뷰어</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

:root{
  --bg:#E0E5EC;
  --fg:#3D4852;
  --muted:#6B7280;
  --accent:#6C63FF;
  --accent-light:#8B84FF;
  --accent-teal:#38B2AC;
  --warn:#C0673E;

  --sh-l: 255,255,255;
  --sh-d: 163,177,198;

  --sh-ext: 9px 9px 16px rgba(var(--sh-d),0.6), -9px -9px 16px rgba(var(--sh-l),0.5);
  --sh-ext-hover: 12px 12px 20px rgba(var(--sh-d),0.7), -12px -12px 20px rgba(var(--sh-l),0.6);
  --sh-ext-sm: 5px 5px 10px rgba(var(--sh-d),0.6), -5px -5px 10px rgba(var(--sh-l),0.5);
  --sh-inset: inset 6px 6px 10px rgba(var(--sh-d),0.6), inset -6px -6px 10px rgba(var(--sh-l),0.5);
  --sh-inset-deep: inset 10px 10px 20px rgba(var(--sh-d),0.7), inset -10px -10px 20px rgba(var(--sh-l),0.6);
  --sh-inset-sm: inset 3px 3px 6px rgba(var(--sh-d),0.6), inset -3px -3px 6px rgba(var(--sh-l),0.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'DM Sans','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.font-display{font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif;}

::selection{background:var(--accent-light); color:#fff;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input{font-family:inherit; color:inherit;}

/* ---------- Layout shell ---------- */
.app{ display:flex; height:100vh; overflow:hidden; padding:20px; gap:20px; }
@media (max-width:860px){ .app{padding:12px; gap:12px;} }

/* ---------- Sidebar ---------- */
.sidebar{
  width:340px; flex-shrink:0; display:flex; flex-direction:column;
  background:var(--bg); border-radius:32px; box-shadow:var(--sh-ext);
  padding:24px 18px; overflow:hidden;
  transition:transform 300ms ease-out, opacity 300ms ease-out;
}
@media (max-width:860px){
  .sidebar{ position:fixed; z-index:40; top:12px; left:12px; bottom:12px;
    width:min(340px, calc(100vw - 48px)); transform:translateX(calc(-100% - 24px)); }
  .sidebar.open{ transform:translateX(0); }
}

.brand{ display:flex; align-items:center; gap:12px; padding:2px 6px 18px; }
.brand .mark{ width:44px; height:44px; border-radius:16px; background:var(--bg); box-shadow:var(--sh-ext-sm);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brand .mark svg{width:22px;height:22px;}
.brand .eyebrow{ font-size:11px; letter-spacing:0.08em; color:var(--muted); font-weight:700; }
.brand h1{ font-size:16px; margin:2px 0 0; font-weight:800; letter-spacing:-0.01em; }

.search-well{ display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:16px;
  box-shadow:var(--sh-inset); padding:12px 16px; margin-bottom:14px; flex-shrink:0; }
.search-well svg{width:18px;height:18px; color:var(--muted); flex-shrink:0;}
.search-well input{ border:none; background:transparent; outline:none; font-size:14px; width:100%; color:var(--fg); font-weight:500; }
.search-well input::placeholder{color:#9AA6B2;}

.filter-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; flex-shrink:0; }
.chip{ font-size:12px; font-weight:700; padding:8px 14px; border-radius:9999px; background:var(--bg);
  box-shadow:var(--sh-ext-sm); color:var(--muted); transition:all 300ms ease-out; white-space:nowrap; }
.chip:hover{ color:var(--fg); transform:translateY(-1px); }
.chip.active{ box-shadow:var(--sh-inset-sm); color:var(--accent); background:var(--bg); }

.list-scroll{ flex:1; min-height:0; overflow-y:auto; margin:0 -6px; padding:2px 6px 6px; }
.list-scroll::-webkit-scrollbar{width:8px;}
.list-scroll::-webkit-scrollbar-thumb{background:rgba(163,177,198,0.5); border-radius:8px;}
.list-scroll::-webkit-scrollbar-track{background:transparent;}

.group-label{ font-size:11px; font-weight:700; color:var(--muted); letter-spacing:0.06em; padding:14px 8px 8px; text-transform:uppercase; }
.group-label:first-child{padding-top:4px;}

.univ-btn{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:13px 16px; margin-bottom:8px; border-radius:16px; background:var(--bg); box-shadow:var(--sh-ext-sm);
  text-align:left; transition:transform 200ms ease-out, box-shadow 200ms ease-out; }
.univ-btn:hover{ transform:translateY(-1px); box-shadow:var(--sh-ext-hover); }
.univ-btn:active{ transform:translateY(0.5px); }
.univ-btn.active{ box-shadow:var(--sh-inset); color:var(--accent); }
.univ-btn .name{ font-size:14px; font-weight:700; }
.univ-btn .region{ font-size:11px; color:var(--muted); font-weight:500; margin-top:2px; }
.univ-btn.active .region{ color:var(--accent-light); }
.univ-btn .pages-badge{ font-size:10px; font-weight:700; color:var(--muted); background:var(--bg);
  box-shadow:var(--sh-inset-sm); border-radius:9999px; padding:4px 9px; flex-shrink:0; }
.univ-btn.active .pages-badge{ color:var(--accent); }

.empty-list{ padding:30px 12px; text-align:center; color:var(--muted); font-size:13px; line-height:1.6; }

/* ---------- Main panel ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg); border-radius:32px;
  box-shadow:var(--sh-ext); overflow:hidden; }

.topbar{ display:flex; align-items:center; gap:14px; padding:18px 26px; flex-shrink:0; }
.hamburger{ display:none; width:44px; height:44px; border-radius:14px; background:var(--bg); box-shadow:var(--sh-ext-sm);
  align-items:center; justify-content:center; flex-shrink:0; }
.hamburger svg{width:20px;height:20px;}
@media (max-width:860px){ .hamburger{ display:flex; } }

.topbar .info{ flex:1; min-width:0; }
.topbar .title-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.topbar h2{ font-size:20px; margin:0; font-weight:800; letter-spacing:-0.01em; }
.topbar .badge{ font-size:11px; font-weight:700; padding:4px 11px; border-radius:9999px; background:var(--bg);
  box-shadow:var(--sh-inset-sm); color:var(--accent-teal); flex-shrink:0; }
.topbar .sub{ font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:500;}

.icon-btn{ width:44px; height:44px; border-radius:14px; flex-shrink:0; background:var(--bg); box-shadow:var(--sh-ext-sm);
  display:flex; align-items:center; justify-content:center; transition:all 200ms ease-out; }
.icon-btn:hover{ box-shadow:var(--sh-ext-hover); transform:translateY(-1px); }
.icon-btn:active{ box-shadow:var(--sh-inset-sm); transform:translateY(0); }
.icon-btn svg{ width:18px; height:18px; }
.icon-btn:disabled{ opacity:0.35; pointer-events:none; }

.section-pills{ display:flex; gap:8px; padding:0 26px 16px; flex-shrink:0; overflow-x:auto; }
.section-pill{ padding:0 14px; height:34px; border-radius:12px; flex-shrink:0; background:var(--bg); box-shadow:var(--sh-ext-sm);
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:12px; font-weight:700; color:var(--muted); transition:all 200ms ease-out; white-space:nowrap; }
.section-pill .num{ width:18px; height:18px; border-radius:6px; background:var(--bg); box-shadow:var(--sh-inset-sm);
  display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--accent); flex-shrink:0; }
.section-pill:hover{ transform:translateY(-1px); }
.section-pill.active{ box-shadow:var(--sh-inset-sm); color:var(--fg); }

.viewer-scroll{ flex:1; min-height:0; overflow-y:auto; padding:6px 26px 40px; }
.viewer-scroll::-webkit-scrollbar{width:9px;}
.viewer-scroll::-webkit-scrollbar-thumb{background:rgba(163,177,198,0.5); border-radius:8px;}
.viewer-scroll::-webkit-scrollbar-track{background:transparent;}

.content-wrap{ max-width:820px; margin:0 auto; }

/* ---------- Section blocks ---------- */
.section-block{ margin-bottom:34px; scroll-margin-top:8px; }
.section-heading{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.section-heading .num-badge{ width:32px; height:32px; border-radius:11px; background:var(--bg); box-shadow:var(--sh-ext-sm);
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--accent); flex-shrink:0; }
.section-heading h3{ font-size:16.5px; font-weight:800; margin:0; letter-spacing:-0.005em; }

.info-table{ background:var(--bg); border-radius:24px; box-shadow:var(--sh-ext); padding:6px; margin-bottom:16px; overflow:hidden; }
.info-table .col-header{ display:grid; padding:12px 18px 8px; font-size:10.5px; font-weight:700; color:var(--muted);
  letter-spacing:0.04em; text-transform:uppercase; }
.info-row{ display:grid; gap:16px; padding:16px 18px; border-radius:18px; }
.info-row:nth-child(odd){ }
.info-row + .info-row{ margin-top:2px; }
.info-row.shaded{ background:rgba(255,255,255,0.35); box-shadow:var(--sh-inset-sm); }

.cols-3 .col-header, .info-table.cols-3 .info-row{ grid-template-columns: 128px 1fr 180px; }
.cols-2 .col-header, .info-table.cols-2 .info-row{ grid-template-columns: 128px 1fr; }
@media (max-width:640px){
  .cols-3 .col-header, .info-table.cols-3 .info-row{ grid-template-columns: 1fr; }
  .cols-2 .col-header, .info-table.cols-2 .info-row{ grid-template-columns: 1fr; }
  .info-table .col-header{ display:none; }
}

.cell-label{ display:flex; align-items:flex-start; }
.cell-label .chip{
  background:var(--bg); box-shadow:var(--sh-ext-sm); color:var(--accent); font-weight:800; font-size:12.5px;
  padding:7px 12px; border-radius:12px; line-height:1.35; white-space:pre-line; box-shadow:var(--sh-inset-sm);
}
.cell-content{ font-size:13.5px; line-height:1.75; color:var(--fg); }
.cell-note{ font-size:11.5px; line-height:1.6; color:var(--muted); font-weight:500; white-space:pre-line; }
@media (max-width:640px){
  .cell-note{ padding-top:8px; border-top:1px dashed rgba(163,177,198,0.6); margin-top:8px; }
}

.cline{ margin:0 0 4px; }
.cline:last-child{ margin-bottom:0; }
.cline.tag{
  display:inline-block; font-weight:800; color:#fff; background:var(--accent);
  padding:3px 10px; border-radius:8px; font-size:12px; margin:2px 0 6px;
}
.cline.bullet{ padding-left:14px; position:relative; }
.cline.bullet::before{ content:"•"; position:absolute; left:0; color:var(--accent); font-weight:700; }
.cline.sub{ padding-left:26px; position:relative; color:var(--muted); font-size:13px; }
.cline.sub::before{ content:"–"; position:absolute; left:14px; color:#9AA6B2; }
.cline.warn{ color:var(--warn); font-weight:600; }
.hl-red{ color:#D64545; font-weight:700; background:rgba(214,69,69,0.09); padding:0 3px; border-radius:4px; }
.cline.tag .hl-red{ color:#fff; background:rgba(255,255,255,0.25); font-weight:800; }

.note-block{
  background:var(--bg); border-radius:20px; box-shadow:var(--sh-inset); padding:16px 20px;
  font-size:12.5px; line-height:1.7; color:var(--muted); margin-bottom:16px; white-space:pre-line;
}
.note-block.disclaimer{ font-size:11.5px; }
.note-block.disclaimer::before{ content:"※ 안내 "; color:var(--warn); font-weight:800; }

.mini-grid-wrap{
  margin:8px 0 10px; border-radius:14px; overflow-x:auto; box-shadow:var(--sh-inset-sm);
  background:var(--bg);
}
.mini-grid{ width:100%; border-collapse:collapse; font-size:11.5px; }
.mini-grid td{ padding:7px 11px; text-align:center; white-space:nowrap; color:var(--fg); }
.mini-grid tr:first-child td{ font-weight:800; color:var(--accent); background:rgba(108,99,255,0.10); }
.mini-grid tr:not(:first-child):nth-child(even) td{ background:rgba(255,255,255,0.4); }
.mini-grid td:first-child{ text-align:left; font-weight:700; color:var(--fg); background:rgba(163,177,198,0.18); }
.mini-grid tr:first-child td:first-child{ background:rgba(108,99,255,0.16); }

.sub-table-wrap{
  margin:8px 0 10px; border-radius:16px; overflow-x:auto; box-shadow:var(--sh-inset-sm);
  background:var(--bg);
}
.sub-table{ width:100%; border-collapse:collapse; font-size:12px; }
.sub-table th{
  padding:9px 14px; text-align:left; font-weight:800; color:var(--accent);
  background:rgba(108,99,255,0.10); white-space:nowrap;
}
.sub-table td{ padding:10px 14px; line-height:1.6; color:var(--fg); vertical-align:top; }
.sub-table td.st-label{ font-weight:700; white-space:nowrap; background:rgba(163,177,198,0.18); }
.sub-table td.st-val{ min-width:180px; }
.sub-table tbody tr:nth-child(even) td{ background:rgba(255,255,255,0.4); }
.sub-table tbody tr:nth-child(even) td.st-label{ background:rgba(163,177,198,0.22); }

/* ---------- Empty state ---------- */
.empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:40px; text-align:center; }
.orbit{ position:relative; width:150px; height:150px; flex-shrink:0; }
.orbit .ring{ position:absolute; border-radius:50%; background:var(--bg); }
.orbit .ring.r1{ inset:0; box-shadow:var(--sh-ext); }
.orbit .ring.r2{ inset:22px; box-shadow:var(--sh-inset-deep); }
.orbit .ring.r3{ inset:52px; box-shadow:var(--sh-ext-sm); display:flex; align-items:center; justify-content:center; animation:float 3s ease-in-out infinite; }
.orbit .ring.r3 svg{ width:26px; height:26px; color:var(--accent); }
@keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
.empty-state h3{ font-size:19px; font-weight:800; margin:0; }
.empty-state p{ font-size:13.5px; color:var(--muted); max-width:340px; line-height:1.7; margin:0; }

.overlay-scrim{ display:none; position:fixed; inset:0; z-index:30; background:rgba(61,72,82,0.35); }
.overlay-scrim.open{ display:block; }
@media (min-width:861px){ .overlay-scrim{ display:none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="overlay-scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L2 8L12 13L22 8L12 3Z" stroke="#6C63FF" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 10.5V16C6 16 8.5 18.5 12 18.5C15.5 18.5 18 16 18 16V10.5" stroke="#6C63FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 8V14" stroke="#6C63FF" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="eyebrow font-display">2028 ADMISSIONS</div>
        <h1 class="font-display">대학 입학전형 뷰어</h1>
      </div>
    </div>

    <div class="search-well">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="대학명으로 검색 (예: 전북대)">
    </div>

    <div class="filter-chips" id="filterChips"></div>
    <div class="list-scroll" id="listScroll"></div>
  </aside>

  <main class="main">
    <div id="mainInner" style="display:flex; flex-direction:column; height:100%;"></div>
  </main>

시 불가 환\n경이면 미적분 우선 선택 권장"],["⑥\n학생부 세특\n작성 방향\n(HOW 중심)","• 세특 평가 핵심: 'WHAT(무엇)'이 아닌 'HOW(어떻게)' 중심\n• 성취 수준의 특성에 따른 개별화된 기록이 가장 중요\n• 단순 활동 나열·보고서 요약X / 학습 과정의 흐름 서술\n• 외부 컨설팅 문구·이인칭 문장 → 즉시 식별, 오히려 불이익","교사가 수업 내 학생의 특\n이한 접근·질문 방식 등 구\n체적 근거 포함해 작성\n창체보다 교과 세특이 훨씬\n중요\n(16주 수업기반기록 신뢰)\n독서: 과목 역량과 연계된\n독서 기록이 핵심\n(독서만 40회 반복 X)"],["⑦\n모집단위별\n특수사항\n(음악대·첨단융합\n학부·광역)","• 음악대학: 수시 미충원 정시 이월 없음 (성악과·작곡과만 예외)\n• 첨단융합학부: 219명, 3학기 후 5개 전공 선택\n• 혁신신약전공 → 약사 국가시험 응시 자격 없음\n• 학부대학 광역: 2학기 후 7개 단과대 소속 변경\n• 공과대학 광역: 1학기 후 기계, 전기정보, 컴퓨터, 화학생물, 산\n업, 항공우주공학 선택","음악대 수시 지원 시\n이월 불가 고지\n(성악ㆍ작곡과 예외별도안내)\n혁신신약전공 약사\n자격 취득 불가\n→ 진로 상담 시 반드시 고지\n광역 모집 입학 후 소속 변\n경 범위ㆍ시기 사전 안내"],["⑧\n역량 중심 평가\n철학 및\n교사 지도 전략","• 서울대는 '전공 적합성' 표현 사용 안 함 → 역량 중심 평가\n• 진로 변경 학생도 이수 과목의 역량이 충실히 드러나면 기회\n제공\n• 도전적 과목 선택·성실한 학교생활이 합격의 핵심 근거\n• 성적 데이터만으로 지원 포기 X → 교사 종합 판단으로 과감하\n게 지원","학원 컨설팅보다 담당 교사의\n종합적 판단이 훨씬 정확\n'학생 역량 근거‘가 생기부에\n풍부하게 나타나면\n실제 합격으로 이어짐\n정시 목표 학생도 수시\n서류 관리 병행 지도\n(교과역량평가 40점)"]],"hasHeader":false},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준 이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다. 또한, 5월 20일 2028 서울대 입시 설명회 입학사정관 발표 내 용 도 포함해서 정리한 내용입니다. 참고하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u002","name":"연세대","region":"서울","category":"seoul","categoryLabel":"서울지역대학","pageRange":"5~8","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심"],["공통","• 수시 총 모집인원: 2,115명(정원 내) + 318명(논술) + 38명(체육) + 13명(특수) = 약2,484명\n• 정시 총 모집인원: 1,133명(정원 내) + 196명(정원 외 포함)\n• 학교폭력 조치사항 반영: 수시(서류평가 정성반영 또는 감점) / 정시(총점 차등 감점)\n• 채용조건형 계약학과(정원 외): 시스템반도체공학과(삼성전자) / 디스플레이융합공학과(LG디스플레이)"],["수시","• 수시 중복지원 제한: 추천형↔종합인재형 중복 불가/ 탐구인재형(일반)↔(국제) 중복 불가\n• [추천형] 일괄합산→ 단계별 전형 변경(2단계 서류평가20% 추가)\n• [학종] 활동우수형·국제인재→ 종합인재형통합 신설\n• [학종] 해외고·검정고시→ 탐구인재형통합 신설 (수능최저 없음)\n• [논술] 수능최저학력기준 신설(기존 없음→ 국, 수, 탐 3합6 이내/영어 3등급 이내/한국사 4등급 이내)\n• [체육인재] 1단계 선발배수3배수→ 5배수 확대"],["정시","• 교과 정량평가(50점) 폐지→ 서류평가(100점) 정성평가신설\n• 언더우드 사고형/ 인문ㆍ사회 통합형/ 영어ㆍ수리ㆍ·과학 제시문 포함 가능\n- 출제범위: 2022 개정 교육과정 보통교과(융합 선택 과목 제외) 전체\n• 자연·통합계열 논술: 수리ㆍ통합형/ 수리 비중 축소+ 과학 제시문 서논술형 도입\n- 수학: 2022 개정 교육과정 보통교과(융합 선택 제외) 전체\n- 통합: 2022 개정 교육과정 통합과학 전체\n• 수능최저(2028 신설): 국ㆍ수ㆍ사탐ㆍ과탐3합 6 이내(국수 모두 포함) + 영어3등급+ 한국사4등급\n- 약학과: 3합 이내(국수 모두 포함)\n• 학교폭력 감점: 1~2호5점/ 3~4호10점/ 5~6호25점/ 7~9호50점"]],"hasHeader":false}]},{"num":"3","title":"권장 이수 과목","blocks":[{"type":"table","rows":[["구분","주요 내용"],["권장 이수\n과목","• 인문계열\n- 특정 전공 연계과목을 별도로 지정하지 않으며, 학생이 자신의 진로와 적성에 따라 과목을 선택하\n고 이수할 것을 권장합니다.\n• 자연계열 및 의·치·약학 계열\n- 수학 진로선택은 자연계열ㆍ의ㆍ치ㆍ약계열 전체 모집 단위에서 공통으로“기하, 미적분Ⅱ”를 권장한다.\n- 과학 진로선택은 전체 모집단위 공통으로 ‘3과목 이상’ 이수를 권장하며, 과목 지정 없이 이수 개수만\n요구된다.\n- 과학 일반선택은 전공 계열에 따라 차이가 있다.\n물리학 연계 전공(물리학과ㆍ전기전자공학부ㆍ기계공학부ㆍ시스템반도체공학과ㆍ디스플레이융합공\n학과 등)은 물리학\n화학 연계 전공(화학과ㆍ화공생명공학부ㆍ신소재공학부 등)은 화학\n생명 계열 전공(생명시스템대학 전체, 의예과)은 생명과학 권장\n- 건축ㆍ도시ㆍ산업공학, 컴퓨터/인공지능 계열, 언더우드국제대학, 진리자유학부(자연)는 과학 일반선\n택을 ‘자율선택’으로 두어 특정 과목을 지정하지 않는다.\n- 의ㆍ치ㆍ약계열 중 치의예과는 물리학ㆍ화학ㆍ생명과학 중 1개 과목 선택을 요구하고, 약학과ㆍ첨\n단약과학과는 생명과학 또는 화학 중 선택을 요구한다.\n• 추천형 교과 반영: 공통ㆍ일반선택ㆍ진로선택 과목(반영 과목A) → 전 과목 충실한 이수 권장\n• 융합선택ㆍ체육예술ㆍ과탐실험(반영과목B)은 성취도E(5단계)/C(3단계) 시 감점→ 관련 과목 이수 시\n유의\n• 논술 출제 범위: 2022 개정 교육과정 보통교과(융합선택 제외) → 관련 교과 심화 이수 권장\n※ 2028학년도 연세대학교 전공연계과목 선택 가이드라인 안내(2026.04.30.) 자료 참고"]],"hasHeader":true}]},{"num":"4","title":"정시모집 주요 안내","blocks":[{"type":"table","rows":[["수능 유형","반영 방식 및 배점","특이사항"],["①\n유형Ⅰ(인문)\n수능(일반전형)","• 모집군: '가'군/ 전형요소: 수능900 + 서류평가100 = 1,000점\n• 수능배점: 국어300 + 수학200 + 영어100 + 사탐200 + 과탐100\n=900점(표준점수)\n- 국어: 표준점수200점× 3/2 = 300점으로 반영\n- 사탐: 표준점수100점× 2 = 200점으로 반영\n- 과탐: 표준점수100점 그대로 반영\n• 서류평가(100점): 교과학습발달상황 및 출결 정성평가\n• 영어: 1=100 / 2=95 / 3=87.5 / 4=75 / 5=60 / 6=40 / 7=25 /\n8=12.5 / 9=5\n• 한국사: 4등급 이내 감점 없음/ 5등급부터 0.2점씩 차등 감점\n• 해당 모집단위: 문과대학, 경영대학, 신과대학, 사회과학대학,\n교육학부, 진리자유학부(인문)","서류평가100점 신설\n(교과 정량\n→ 정성평가 전환)"],["②\n유형Ⅱ(자연)\n수능(일반전형)","• 모집군: '가'군/ 전형요소: 수능900 + 서류평가100 = 1,000점\n• 수능 배점: 국어200 + 수학300 + 영어100 + 사탐100 +\n과탐200 = 900점(표준점수)\n- 수학: 표준점수200점× 3/2 = 300점으로 반영\n- 사탐: 표준점수100점 그대로 반영\n- 과탐: 표준점수100점× 2 = 200점으로 반영\n• 의예과(단계별): 1단계 수능850(2.5배수) → 2단계 수능850+서류\n100+면접50\n※ 고른기회 의예과: 1단계(3배수), 2단계 동일\n• 해당 모집단위: 이과대학, 공과대학, 생명시스템대학, 인공지능융합\n대학, 의예과, 치의예과, 약학과, 진리자유학부(자연)","서류평가100점 신설\n의예과 : 단계별 전형 유지"],["③\n고른기회전형\n농어촌학생\n(정원 외)","• 모집군: '가'군/ 나군(음악대)\n• 수능+ 서류평가(100점)\n- 서류: 교과학습발달상황·출결(정성평가)\n※ 의예과: 단계별 전형\n1단계 수능(3배수) → 2단계 수능+서류100+면접50\n※ 체육교육학과: 수능850+면접50+실기100\n※ 스포츠응용산업학과: 수능900+실기100\n※ 예능(음악): 수능300+실기700('나'군)\n• 수능 배점 일반전형과 동일","농어촌 인정기준 확인\n(읍·면/도서·벽지 소재\n일반고·중학교만 해당)"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n추천형\n전형방식 변경","• 일괄합산(교과100%) → 단계별 전형 변경\n• 2단계에 서류평가(20%) 추가\n• 수능최저 전 모집단위 유지\n• 학교별 추천인원 최대10명","교과 성적뿐만 아니라\n비교과(출결·교과활동)\n관리도 병행 필요\n→ 융합선택ㆍ체육예술 과목\n출결, 성취도 유의\n추천인원10명 제한\n→ 교내 경쟁 고려한 지원\n전략"],["②\n학종 전형명\n전면 개편","• 활동 우수형+국제 인재→ 종합 인재형(2단계 서류 70+면접30)\n• 해외고/검정고시→ 탐구 인재형(수능 최저 없음)\n• 국내고→종합 인재형/ 해외고ㆍ국제계열→탐구 인재형(국제)\n• 추천형↔종합 인재형 간 중복지원 불가","지원 전형 명칭 변경 혼동\n주의\n→ 2028 요강 반드시 재\n확인"]],"hasHeader":true},{"type":"table","rows":[["③\n논술\n수능최저신설","• 2027: 논술전형 수능최저 없음\n• 2028: 전 모집단위 수능최저 신설\n• 3합6 이내(국수 모두 포함)+영어3등급+한국사4등급\n• 약학과: 3합5 이내","논술 지원 시\n수능최저 통과 여부 사전\n검토 필수\n→ 국어·수학 모두 포함\n조건 주의(선택 불가)\n수능 준비 없이 논술만 준비\n하던 전략 전면 수정 필요\n약학과 지원자\n: 더욱 높은 수능 수준 요구"],["④\n정시\n서류평가신설","• 교과 정량평가(50점) 완전 폐지\n• 서류평가(100점) 신설: 교과학습발달상황·출결 정성평가\n• 수능900 + 서류100 = 1,000점 구조\n• 언더우드국제대학: 면접 폐지, 일반계열과 동일 구조로 통합","수능 성적 외 출결ㆍ교과 활\n동 기록도 정시에서 반영됨\n→ 3학년까지 충실한 학교\n생활 유지 필요\n언더우드 지원 시 면접 없\n음 확인\n→ 전략 조정\n서류평가 정성평가:\n결석ㆍ무단 이탈 등 불성\n실한 기록 주의"],["⑤\n수능 탐구\n가산점 폐지","• 2028 통합형 수능(선택과목 폐지)에 따른 변경\n• 기존 탐구 변환점수(가산점 포함) 방식 폐지\n• 표준점수 단순 반영으로 변경\n• 유형Ⅰ(인문): 사탐200점+ 과탐100점\n/ 유형Ⅱ(자연): 사탐100점+ 과탐200점","탐구2과목 응시 후 상위1\n과목\n반영 방식 확인 필요\n(요강 확인 필수)"],["⑥\n종합인재형\n면접 변화","• 활동우수형(2027): 서류60%+면접40%\n• 종합인재형(2028): 서류70%+면접30% → 서류 비중 증가, 면접 비중\n감소\n• 제시문 기반 면접 유지\n• 언더우드학부: 영어 제시문·영어 구술면접","면접 비중 감소로 서류\n(학생부)관리가 더 중요해짐\n→ 활동의 일관성·\n구체성·진정성 강 /나군\n예체능","• 가군 스포츠매니지먼트전공: 수능 90% + 실기 10%\n가군 연극영화학과/연극영화학과: 수능 55% + 실기 45%\n• 나군 스포츠사이언스전공: 수능 70% + 실기 30%\n• 가군 33명/ 나군 17명","모집단위별\n수능ㆍ실기 반영\n비율 상이"],["","가/나군\n특별전형","• 지원자격 : 농어촌학생, 특성화고교졸업자, 기회균형선발, 특수교육대상자\n• 전형요소: 수능 100% / 수능최저 없음","지원 자격\n충족 여부 확인 필요"],["②\n실기/실적\n(가/나군 예체능)","","• 나군 관현악과: 1단계 실기100%(2배수), 2단계 실기 80% + 수능 20%\n• 가군 58명/ 나군 21명","관현악과\n가군 → 나군 이동\n실기반영비율 변경\n학과별전형요소\n및 반영비율 상이"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n학생부교과(추천형)\n전면 개편","추천형 지원 자격 : 졸업 예정자만 지원 가능으로 변경.\n학교장 추천 인원 제한(고3 재적인원 11%) 폐지.\n평가 방식 변화\n교과90+정성10 → 교과60+종합평가40으로 변경","세특ㆍ과목선택ㆍ학업역량 관리\n필요.\n추천 인원 제한 폐지로 지원 기회\n확대"],["②\n학생부교과\n수능최저 기준 변경","모집 단위별로 3개 영역 각 3등급 이내로 변경.\n자연·상경은 수학 포함 필수","등급 합 충족보다 각 영역 안정적\n성적 확보가 중요. 수학 경쟁력 확\n보 필요"],["③\n학생부종합\n전형 체계 개편","학생부종합(서류형) 폐지, 학생부종합(추천형) 폐지 후\n학생부종합(학업형) 811명으로 통합 운영","전형 선택보다\n학생부 경쟁력 자체가 중요해짐.\n학업 역량 중심 준비 필요"],["④\n학생부종합(면접형)\n모집단위 대폭 확대","공학계열, 인문사회계열, 경영·경제계열 등 다수 모집단\n위에서 면접형 신설 또는 확대","학생부 기반 및 제시문 기반 면접\n준비 필요.\n면접 역량이 당락에 미치는 영향\n증가"],["⑤\n논술전형\n반영방식 변경","논술 90% + 학생부 출결 10%반영으로 변경","논술이 여전히 핵심이지만\n출결 관리도 중요"],["⑥\n학생부종합\n(체육인재) 신설","학생부종합(체육인재) 전형 신설","체육 분야 활동 실적과\n학생부 경쟁력을 함께 갖춘 학생\n에게 새로운 기회"],["⑦\n정시 모집군 변경","컴퓨터소프트웨어학부, 파이낸스경영학과\n나군 → 다군 이동","가ㆍ나ㆍ다군 지원 조합을 새롭게\n설계해야 함. 특히 상위권 수험생\n지원 전략 변화 예상"],["⑧\n수시 확대·정시 축소","수시 비율 56.5% → 66.8%,\n정시 비율 43.5% → 33.2%로 변화.\n학생부교과ㆍ학종ㆍ논술 모집인원 증가","정시 중심 준비보다 학생부 관리\n와 수시 전략 중요성 증가"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u007","name":"이화여대","region":"서울","category":"seoul","categoryLabel":"서울지역대학","pageRange":"23~26","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 정원 내 모집인원 3,276명 유지 / 수시2,085명(63.6%) / 정시1,191명\n(36.4%) 선발","모집비율 유지"],["수시","① 학생부종합 미래인재전형(면접형) 유지(18 공통","• 수시: 3,007명 (55.6%) / 정시: 2,404명 (44.4%) 선발 [재외국민 제외 인원]\n• 세부 전형: 수시 학종 1,354명(25%), 정시 수능･학생부형 1,348명(24.9%),\n정시 수능형 611명(11.3%) 선발\n• 학생부 반영 교과 변경\n- (기존)\n인문･자연: 국･영･수･사･과･한국사 전 과목(공통･일반선택, 석차등급)\n국･영･수･사･과 상위 3과목(진로선택, 성취도)\n- (변경)\n인문: 국･영･수･사(한국사 포함) 전 과목(공통･일반･진로･융합선택, 석차등급 반영)\n자연: 국･영･수･과･한국사1, 2 전 과목(공통･일반･진로･융합선택, 석차등급 반영)\n• 진로선택과목 성적 산출 방식 변경:\n상대평가 등급과 절대평가 성취도를 등급으로 치환한 성적\n(예: 성취도 A=1등급) 중 상위 성적 반영\n- 수시: 사/과 진로선택과목의 계열별 반영 교과 전 과목\n- 정시: 학생부 반영 교과 전 과목\n• 성취도만 제공되는 사회/과학 융합선택과목은 미반영","전년 대비\n수시 55.3%\n정시 44.7%\n정시 23명 감소,\n수시 비중\n소폭 증가\n문ㆍ이과\n구분 없는 융합형 학\n생 선발 체제\n구축\n고교 전 과정에서 사\n회･과학 교과\n모두 충실한 내신 관\n리가 필수"],["수시","① 【학생부종합(네오르네상스전형)】 이원화 ★신설\n- 기존 단일 전형에서 '서류형'과 '면접형'으로 분리 선발\n- (서류형) 서류 100%, 수능최저 적용. 절대평가 성취도 적극 활용\n- (면접형) 1단계 서류, 2단계 면접(30%) 포함. 수능최저 미적용\n② 【학생부교과(지역균형전형)】 졸업 연도 및 학교장 추천 자격 제한\n- 졸업 연도:\n2025년 2월 및 이후 졸업(예정)자 → 2028년 2월 졸업예정자(재학생)로 제한\n- 국내고등학교 3개 학기 이상(기존 유지)\n- 학교폭력 조치 상황: 4호 이상 추천 불가 → 1호 이상 추천 불가(강화)\n③ 【학생부종합(기회균형Ⅰ·Ⅱ)】 전형 요소 변경:\n(기존) 서류 70% + 교과 30% → (변경) 서류 100%\n④ 수능최저학력기준 탐구 과목 반영 변경:\n(기존) 사회/과학 2과목 반영 → (변경) 통합사회/통합과학 중 상위 1과목 반영\n⑤ 【논술우수자】 사회계 문항 2문제로 축소,\n자연계 수학 6문항, 의약학계 수리논술 60 + 과학논술 40(물화생 중 택 1)","수능최저 충족 vs\n면접 역량 등\n학생 강점 에 따라\n전형 선택의 폭이\n넓어지고 세분화 됨.\n기회균형전형\n교과정량평가(30%)\n폐지로\n내신 다소 낮아도\n생기부 정성 우수자\n지원 증가 예상"],["정시","① 정시 수능 전형 이원화\n- 수능형: 수능 100%\n- 수능ㆍ학생부형\n★신설 : 수능 90% + 학생부 10%(교과 50%, 출결 25%, 봉사 25%)\n② 수능 반영 비율 및 방법 변경\n- 인문: 수학(25%→30%), 탐구(35%, 2과목→25%, 상위 1과목)\n- 자연: 국어(25%→30%), 탐구(35%, 2과목→통합사회 10%, 통합과학 20%)\n- 예술･체육: 국어(60%→70%), 탐구(40%, 1과목→30%, 상위 1과목)\n③ [수능･학생부형] 자연계열 수학/과학 교과 이수 가산점 부여(최대 8점)\n･ 수학 교과 18학점(단위) 또는 5과목 이상: 4점\n･ 과학 교과 20학점(단위) 또는 6과목 이상: 4점","정시\n수능･학생부형도입\n교과 및 3학년 2학기\n출결/봉사성실도가\n당락에 유의미한\n영향 을 미치게 됨."]],"hasHeader":true}]},{"num":"2","title":"수시(교과, 학종, 논술)전형 소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시\n(교과)","【학생부교과(지역균형전형)】\n• 지원 자격: 2028년 2월 졸업예정자(재학생 한정), 학교장 추천 필요(추천 인원 제한 없음)\n• 전형 요소: 학생부 교과/비교과 70% + 교과종합평가 3 ,["①\n수능위주\n일반전형\n(인문/자연)\n(가)군+(나)군","• 전형 요소: 수능 80% + 학생부 교과 18% + 출결 2%\n• 수능 반영: 인문ㆍ자연 모두 '표준점수' 직접 적용\n(탐구 변환표준점수 폐지)\n• 탐구 가산점\n인문계(사탐), 자연계(과탐) 응시자 해당 탐구 표준 점수에 3% 가점 부여","• 정시 일반전형 학생부\n(교과+출결) 정량반영\n(20%) 신설\n• 탐구 변표 폐지에 따라\n당해 연도 과목별\n표점 격차(난이도)가\n합불에 직접적 영향 미침"],["②\n수능위주\n기회균형Ⅱ\n(정원 외)","• 전형 요소: 수능 80% + 교과 18% + 출결 2%\n• 대상: 농어촌학생, 특성화고교졸업자, 기초생활수급자 및 차상위계층 등","• 전형별 세부 지원 자격\n(재학기간, 거주지 등)\n철저 확인 필수"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n교과지역균형\n서류비중확대","• 교과 정량 축소(80% → 60%) 및 서류 정성 대폭 확대\n(20% → 40%)\n• 단순 내신 등급 외 '교과 세특 및 출결' 기반의\n학업역량ㆍ성실성 중시 평가","• 내신 극상위권일지라도 미인정 결석 감점 및\n세특 부실 시 탈락 위험성 강력 안내\n• 추천 인원 제한 폐지에 따른 경쟁률 상승\n대비 하향·소신 지원 밸런스 유도"],["②\n논술 전형\n수능최저신설","• 논술 100% 선발로 내신 부담은 사라졌으나, 수능 최저\n(3합 7, 한국사 4) 신설","• 내신 저조 학생 중 '모의고사 3합 7'\n안정적 확보 가능자 중심 논술 특화 지도\n• 수능 최저 미충족 시 논술 실력 무관 즉시\n탈락함을 철저히 주지"],["③\n정시일반전형\n학생부정량 반영","• 정시(인문·자연) 수능 100% 폐지,\n학생부 교과(18%) 및 출결(2%) 정량 반영 신설","• 이른바 '정시 파이터' 특화 지도:\n3학년 2학기 미인정 결석ㆍ조퇴\n절대 금지 및 기본 내신 등급 방어 강력\n지도"],["④\n수능 탐구\n가산점 유불리","• 탐구 백분위 변표 폐지 및 표준점수 직접 반영\n• 계열별(인문 - 사탐, 자연 - 과탐) 선택 시\n표준점수 3% 가점 부여","• 통합 수능 - 크로스 교차 지원보다,\n본인 모집단위 계열에 맞는\n탐구 선택 3% 가점 획득으로 유리함을\n안내"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u012","name":"건국대","region":"서울","category":"seoul","categoryLabel":"서울지역대학","pageRange":"38~41","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 모집인원 비율 변동: 총 3,410명 선발 (전년 대비 2명 감소)\n- (수시) 1,952명(57.2%) → 1,938명(56.8%) [소폭 감소]\n- (정시) 1,460명(42.8%) → 1,472명(43.2%) [소폭 증가]\n• 학교폭력 조치사항 전 전형 감점 적용 :\n- 1호: 감점 없음 / 2호: -20점 / 3호: -30점 / 4호: -200점 / 5호: -300점 /\n6~9호: 500점 등 엄격한 감점표가 모든 전형에 적용됨.\n• 수능 최저학력기준 전형별 이원화 설정\n- [인문/자연] 국, 수, 영, 탐(상위 1과목) 3합 8 이내\n- [수의예과] 국, 수, 영, 탐(2과목 평균) 3합 4 이내\n• 영어 환산점수 및 한국사 감점 기준 :\n- 영어: 1등급 200점 만점 기준, 2등급 197점, 3등급 194점, 4등급 190점 반영\n- 한국사: 5등급부터 1점씩 감점 적용","• 수시 인원 소폭 감소,\n정시 인원 늘어남.\n• 학폭 처분 4호부터는\n사실상 정시에서도 합\n격이 불가능한 수준의\n격차(-200점) 발생\n• 수의예과 최저 반영 시\n교과 전형과 논술 전\n형의 탐구 과목 수 차\n이 주의"],["수시","• ① 【학생부교과(KU지역균형)】 수능 최저학력기준 전면 신설:\n- 2027학년도 수능 최저 미적용 → 2028학년도 수능 최저학력기준 전면 도입\n[인문/자연 3합 8(탐1), 수의예 3합 4(탐2평)]\n- (전형방법) 학생부(교과정량) 70% + 학생부(교과정성: 과목선택, 세특) 30%\n• ② 교과 정량평가 반영 과목 대폭 축소(내신 완화):\n- (기존) 석차 등급이 표기된 전 과목 → (변경) 공통, 일반선택, 진로선택과목 중\n상위 20개 과목(2015 개정 교육과정은 공통, 일반선택 반영)\n- ★고교학점제 성취도(A/B/C) 평가는 반영하지 않음.\n• ③ 【논술(KU논술)】 통합논술 일원화 및 논술 100% 선발\n- 계열 구분 없이 모두 통합논술로 일원화하여 선발함.\n- (문항) 국어+통합사회 1문항, 수학 3문항 출제\n- (출제범위) 국어(공통국어1·2, 화법과언어, 독서, 작문, 문학), 통합사회1·2 /\n수학(공통수학1·2, 대수, 미적분Ⅰ, 확률과통계)","• 교과 전형의 수능 최\n저 신설 및 상위 20과\n목 반영 변동으로 인\n해 내신 합격선 합리\n화 및 최저 미충원 낙\n폭 과다 예상\n• 서류 정성평가(30%)에\n대한 세부 기준은 대\n학 발표 가이드북에\n상세 수록됨"],["정시","• ① 【수능위주(KU일반)】 수능 반영 방법(비율) 및 모집군 변경\n- 국, 수, 탐: 표준점수, 영:등급별 환산점수, 한국사: 등급별 감점\n- 반영 방법 변경: A, B, 예체능\n- 반영 비율 변경: 국, 수↑(45% 또는 35%), 탐구↓(10%)\n- 인문/자연/KU자유전공학부: A와 B 모두 적용하여 높은 점수 반영\n- 탐구 영역 반영 비율 10%로 제한\n- 탐구 반영 과목 수 상위 1과목만 반영하도록 축소\n- 생명공학부 모집군 변경: (기존) 다군 → (변경) 나군\n• ② 【자유전공학부】 정시 학생부 정성평가 10% 반영\n- (기존) 수능100% → 수능 90% + 학생부 교과정성 10%\n- (학생부 반영) 과목 선택 내역 및 세특을 3학년 2학기 기록까지 정성평가함．","• 국어, 수학을 잘 본\n학생에게 압도적으로\n유리한 구조\n• 정시전형 준비학생\n3학년 2학기 세특 관리\n필수"]],"hasHeader":true}]},{"num":"2","title":"수시(교과, 학종, 논술) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","【KU지역균형】\n• 고교별 추천 인원 제한 없음.\n• 전형 요소: 학생부(교과 정량) 70%+학생부(교과 정성: 과목 선택, 세특) 30%\n• 교과 정량 방법: 공통, 일반, 진로선택 중 상위 20개 과목만 추출 (성취도 평가 미반영)\n• 수능 최저: 적용 (인문/자연 3합 8(탐1) / 수의예과 3합 4(탐2평))\n• 학폭 감점 적용"],["수시\n(학종)\n서류, 면접","【KU자기추천】\n• 전형 요소: [1단계] 서류 100% (3배수) → [2단계] 1단계 성적 70% + 면접 30%\n• 면접 방식: 제출 서류(학생부) 기반 개별 개별면접(10분 내외), 서류 진위 여부 확인, 평가자(2인):\n지원자(1인), 블라인드 면접 실시\n• 면접 평가 요소: 학업 역량, 진로 역량(자유전공은 '성장 역량'), 공동체 역량\n• 수능 최저: 미적용\n• 학폭 감점 적용\n【기회균형】\n• 대상: 국가보훈대상자, 농어촌학생, 기초생활 및 차상위\n• 전형 요소: 서류 70%+학생부(교과 정량) 30%\n• 수능 최저: 없음\n• 학폭 감점 적용\n【특수교육대상자】(정원외)\n• 전형 요소: [1단계] 서류 100% (3배수) → [2단계] 1단계 성적 70% + 면접 30%\n• 면접 방식: 제출 서류(학생부) 기반 개별면접(10분 내외), 서류 진위 여부 확인, 평가자(2인):\n지원자(1인), 블라인드 면접 실시\n• 수능 최저: 없음\n• 학폭 감점 적용"],["수시(논술)","【KU논술전형】\n• 전형 요소: 논술 100% (학생부 미반영)\n• 논술 방식: 문해력과 논리적 사고력을 모두 평가할 수 있는 '통합' 단일 유형 출제\n(국어+통합사회 1문항, 수학 3문항 출제)\n• 수능 최저: 적용 - 인문/자연 3합 8(탐구 상위 1과목) / 수의예과 3합 4(사회, 과학 2과목 평균)\n• 학폭 감점 적용"]],"hasHeader":true}]},{"num":"3","title":"대학별 지향 인재상 및 서류 평가 요소, 권장 이수 과목","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","① 일반 학과(학부): 교내 활동에 자발적으로 참여하고, 해당 전공에 관심과 소질이 있는 자\n② KU 자유전공학부:\n- 고교생 수준의 학업적 기초역량과 다양한 경험을 바탕으로 융·복합적 소양을 기른 자\n- 학교생활에서 깊이 있는 탐색으로 학문 간 응용능력을 갖춘 자"],["서류\n평가 요소","[학생부(교과정량)]\n- 해당 전형: 학생부 교과(KU지역균형), 학생부 종합(기회 균형, 특성화고졸 재직자)\n- 국, 수, 영, 사, 과, 한국사: 공통과목, 일반선택, 진로 선택 과목 중 상위 20개 과목의 석차 등급 및\n이수학점(단위) 반영 / 등급의 기준 점수를 반영, 성취도 미반영\n[학생부(교과정성)]\n- 해당 전형: 학생부 교과(KU 지역균형), 수능(KU일반)-단과대학 자유전공학부\n- 교과 학습 발달 상황의 교과 이수 내역, 세특(이수 추천 과목 반영)\n- 평가기준\n① 학업 역량: 학업성취도, 학업태도, 탐구력\n② 진로 역량: 전공(계열) 관련 교과 이수 노력, 성취도, 진로 탐색 활동과 경험\n③ 공동체 역량: 협업과 소통능력, 나눔과 배려, 성실성과 규칙준수, 리더십\n- 학폭 조치 사항 반영(감점 적용)"]],"hasHeader":true},{"type":"table","rows":[["","[학생부종합전형]\n- 학과/학부 모집\n① 학업 역량: 학업성취도, 학업태도, 탐구력\n② 진로 역량: 전공(계열) 관련 교과 이수 노력, 성취도, 진로 탐색 활동과 경험\n③ 공동체 역량: 협업과 소통 능력, 나눔과 배려, 성실성과 규칙 준수, 리더십\n- KU자유전공학부 모집(전공을 정하지 않으므로 진로 역량 대신 '성장 역량' 평가)\n① 학업 역량: 학업성취도, 학업태도\n② 성장 역량: 자기 주도성, 창의적 문제해결력, 경험의 다양성\n③ 공동체 역량: 협업과 소통 능력, 나눔과 배려, 성실성과 규칙 준수, 리더십"],["권장 이수\n과목","[KU:PICK(이수 추천 과목)]\n- 일반 선택 과목을 먼저 이수하고, 진로･적성에 맞게 진로 선택 과목 및 융합 선택 과목 이수를 추천\n- 전체 과목 이수 이력과 수업 내용을 함께 고려하여 평가함. 특정 과목의 이수가 필수는 아님\n① 인문(문과대학, 사범대학): 국어, 영어, 사회\n② 사회과학(사회과학대학, 경영대학, 부동산과학원): 국어, 사회, 수학(대수, 미적분Ⅰ, 확통)\n③ 이학, 공학, 건축, 생명(이과대학, 공과대학, 건축대학, 융합 과학기술원, 생명과학대학, 수의과대학):\n수학(대수, 미적분Ⅰ･Ⅱ, 확통), 과학(일반선택 먼저 이수 후, 진로와 적성에 맞게 진로 선택 이수)\n※ 공과대학: 미적분Ⅰ･Ⅱ, 기하 / 물리학 이수 추천\n④ 자유전공(KU자유전공학부): 계열 상관없이 자신의 진로와 적성에 따라 과목 선택하여 이수"]],"hasHeader":false}]},{"num":"4","title":"정 },{"id":"u023","name":"인천대","region":"인천","category":"seoul","categoryLabel":"서울지역대학","pageRange":"73~75","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 단과대학 및 모집단위 명칭이 일부 변경됨.\n• 정보기술대학은 인공지능대학으로 개편되며, 컴퓨터공학부는 컴퓨터공학\n전공과 인공지능전공의 2개 세부전공을 신설하되 기존과 동일하게 학부\n단위로 모집함.\n• 정보통신공학과는 인공지능정보통신공학부로, 임베디드시스템공학과는\n인공지능시스템공학과로, 운동건강학부는 스포츠의학부로 명칭이 변경됨.\n• 학교폭력 조치사항 정량 감점 기준이 변경되어 수시·정시 전체 전형에\n반영됨. 학교폭력 1호(서면사과) 감점 신설. 학생부종합전형은 정량 감점\n외에도 서류 또는 면접 정성평가 시 별도 반영됨.","인공지능대학 신설 및 모\n집단위 명칭 변경 확인\n필요.\n학교폭력 조치사항은 전\n형별 감점률이 달라 학생\n부 확인 필요"],["수시","① 자유전공학부에 학생부종합 자기추천전형 - 서류형이 신설됨.\n자유전공학부(인문)30명, 자유전공학부(자연)45명을 서류 100%로 선발함.\n② 학생부종합 자기추천전형-면접형은 모집인원이 694명에서 732명으로\n확대되고, 2단계 면접 반영비율이 30%에서 40%로 상향됨.\n특수교육대상자전형도 2단계 면접 반영비율이 40%로 상향됨.\n③ 자기추천전형 - 면접형에서 예체능계열 모집단위가 확대되어 기존\n스포츠의학부 4명에 더해 체육교육과 2명을 선발함.\n④ 학생부교과 교과성적우수자전형과 지역균형전형이 교과성적우수자전형\n으로 통합 됨. 모집인원은 608명이며, 학교장 추천을 필요 로 하고 수능\n최저학력기준을 적용 함. 검정고시 출신자 지원 불가하고, 고교출신자 3\n수생까지 지원 가능함.\n⑤ 학생부교과 사회통합전형 은 모집인원이 55명에서 82명으로 확대되고,\n검정고시 출신자도 지원 가능하고, 고교출신자 3수생까지 지원 가능함.\n⑥ 교과성적 환산 체계 변경 : 고교출신자는 9등급제+5등급제 병행, 검정\n고시출신자는 검정고시성적평균에 따른 비교내신 변경","수시\n학생부 교과 통합\n학종 면접 비율 상향\n자유전공학부 서류형 신설"],["정시","① 정시 일반학생전형은 가군 395+1명, 나군 64+1명, 다군 277+2명을 선발.\n체육계열을 제외한 인문ㆍ자연계열 및 디자인학부는 수능 100%로 선발.\n② 수능 성적 반영방법이 변경됨.\n인문계열/ 패션산업학과 : 국어(35%), 수학(25%), 탐구(20%), 영어(20%)\n자연계열과 동북아국제통상물류학부 : 국어(25%), 수학(35%), 탐구 20%, 영어(20%)\n③ 탐구는 인문ㆍ자연계열에서 사회 또는 과학 중 상위 1과목 반영,\n제2외국어/한문으로 대체할 수 없음.\n④ 영어 등급별 점수표 변경\n4등급 점수 : 80점 → 85점(조정), 5등급 점수 : 70점 → 60점(조정)","정시는 탐구 반영비율 하락,\n영어 반영비율 상향.\n탐구 상위 1과목 반영.\n영어 4,5등급 간 25점 격차\n- 영어 관리 중요성 증가"]],"hasHeader":true}]},{"num":"2","title":"수시(교과, 학종) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","【학생부교과(교과성적우수자전형)】 2026년 이후 국내 고등학교 졸업(예정)자 중 국내 고등학교에서 3\n학년 1학기까지 3학기 이상 교육과정을 이수하고, 소속 고등학교장의 추천을 받으며, 2028학년도 수능\n에 응시 예정인 자가 지원 가능함.\n고교별 추천 인원 제한은 없음. 전형방법은 학생부교과 100%이며 모집인원은 608명임.\n수능최저학력기준\n인문계열ㆍ자연계열ㆍ디자인학부는 4개 영역 중 2개 영역 등급 합 7 이내,\n동북아국제통상전공은 2개 영역 등급합 6 이내임.\n국어, 수학, 영어, 탐구 중 2개 영역을 반영하며, 탐구는 사회 또는 과학 중 상위 1과목만 인정함. 검정고시\n출신자는 지원할 수 없으며, 고교출신자는 3수생까지 지원 가능함.\n【학생부교과(사회통합전형)】 2026년 이후 국내 고등학교 졸업(예정)자 또는 고등학교 졸업 학력 검정\n고시 합격자 중 지원자격을 충족하는 자가 지원 가능함.\n백혈병·소아암 병력자, 직업군인ㆍ경찰ㆍ소방ㆍ교정직 공무원 자녀, 집배원ㆍ환경미화원 자녀, 다문화\n가정 자녀, 다자녀 가정 자녀, 장애인 부모의 자녀 등이 해당함.\n모집인원은 82명이며, 학생부교과 100%로 선발하고 수능최저학력기준은 적용하지 않음.\n검정고시 출신자도 지원 가능하며, 고교출신자는 3수생까지 지원 가능함."],["수시\n(학종)\n서류, 면접","【학생부종합(자기추천전형-면접형)】 고등학교 졸업(예정)자 또는 관계 법령에 따라 동등 이상의 학력이\n인정된 자가 지원 가능함. 모집인원은 732명이며, 1단계 서류 100%로 선발하고 2단계에서 1단계 성적\n60% + 면접 40%를 반영함. 1단계 선발배수는 일반 모집단위 3배수, 사범대학은 4배수, 스포츠의학부\n와 체육교육과는 5배수임. 수능최저학력기준은 적용하지 않음.\n【학생부종합(자기추천전형-서류형)】 자유전공학부에 신설된 전형으로, 자유전공학부(인문) 30명, 자유전\n공학부(자연) 45명을 서류 100%로 선발함. 수능최저학력기준은 적용하지 않음.\n【학생부종합(기회균형전형)】 국가보훈대상자, 기초생활수급자, 차상위계층, 한부모가족, 농어촌학생 등\n을 대상으로 하며 모집인원은 110명임. 서류평가 100% 일괄합산 전형이며 수능최저학력기준은 없음.\n농어촌학생은 중·고교 전 교육과정 이수 및 본인·부모 거주 유형 또는 초ㆍ중ㆍ고 전 교육과정 이수\n및 본인 거주 유형 중 하나를 충족해야 함.\n【학생부종합(특수교육대상자전형, 정원 외)】 모집인원은 48명이며, 1단계 서류 100%, 2단계 1단계 성\n적 60% + 면접 40%로 선발함. 수능최저학력기준은 없음.\n【학생부종합(서해5도출신자전형, 정원 외)】 모집인원은 6명이며, 서류평가 100% 일괄합산으로 선발함.\n수능최저학력기준은 없음."]],"hasHeader":true}]},{"num":"3","title":"대학별 지향 인재상","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","핵심 키워드 : 지식탐구, 의사소통, 창의융합, 도전창조, 협업인성, 문제해결\n(출처 : 대학 홈페이지)\n창의혁신에 도전하는 소통형 인재"]],"hasHeader":true}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["수능 유형","반영 방식 및 배점","특이사항"],["정시 수능\n(일반학생)","가군 395+1명, 나군 64+1명, 다군 277+2명 선발.","일반 인문ㆍ자연계열은 수능 100%\n수능 반영비율과 영어 점수표 변화 중요"],["정시 수능\n(기회균형, 정원 외)","가군 26명, 다군 19명 선발.\n기초생활수급자, 차상위계층, 한부모가족 대상 전형\n이며, 수능 100% 일괄합산으로 선발.","지원자격 입증서류 확인 필요"],["정시 수능\n(농어촌학생, 정원 외)","가군 31명, 다군 22명 선발.\n인문ㆍ자연계열은 수능 100%로 선발.","농어촌학생은 유형별 재학 및 거주 요건을\n엄격히 확인해야 함.\n특목고, 대안학교, 검정고시 출신자는 지원 불가"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n학생부\n교과전형 통합","교과 성적우수자 전형과 지역 균형전형이 교과 성적\n우수자전형으로 통합됨.\n학교장 추천과 수능최저학력기준을 적용함.","기존 지역균형전형처럼 수능최저가 없다고\n안내하지 않도록 주의.\n교과 지원자는 학교장 추천과 수능최저 함께\n관리"],["②\n자기추천\n면접 비율 상향","자기추천 - 면접형은 2단계에서 면접 반영 비율이 30%에서\n40%로 상향됨.\n특수교육대상자전형도 면접 40% 반영함.","학생부 기반 면접 준비 강화\n활동의 의미와 전공 관심도를 설명할 수 있\n도록 지도"],["③\n자유전공학부\n서류형 신설","자유전공학부(인문ㆍ자연)자기추천-서류형 신설\n서류 100%로 선발.","자유전공학부 지원 희망 학생은 전공 선택\n가능 범위와 제한 학과반드시 확인"],["④\n인공지능대학\n개편","정보기술대학이 인공지능대학으로 개편되고,\n컴퓨터공학부는 컴퓨터공학전공과 인공지능전공으로\n세부 전공을 신설함.","컴퓨터ㆍAI 관련 진로\n모집단위 명칭 변경 확인.\n컴퓨터공학부ㆍ인공지능정보통신공학부\nㆍ인공지능시스템공학과의 차이 구분 후 지원"],["⑤\n사회통합전형\n변화","사회 통합 전형은 모집인원 55명에서 82명으로 확대.\n검정고시 출신자도 지원 가능함.\n수능최저학력기준은 없음.","지원자격 해당 학생을 조기 발굴하고, 자격\n입증서류 준비를 안내.\n검정고시 출신자 지원 가능 여부도 확인"],["⑥\n정시 수능\n반영비율","인문계열은 국어(35%), 수학(25%)\n자연계열은 국어(25%), 수학(35%)을 반영함.\n동북아국제통상물류학부는 자연계열과 동일하게 수학\n35%를 반영함.","학생의 국어·수학 강점에 따라 모집 단위\n선택 전략을 세분화. 동북아국제통상물류학부\n지원자는 수학 반영비율을 반드시 확인"],["⑦\n탐구 반영 방식","인문ㆍ자연계열은 사회 또는 과학 중 상위 1과목\n반영하며 제2외국어/한문으로 대체할 수 없음.","탐구 2과목 평균으로 오해하지 않도록 안내.\n상위 1과목 반영 구조를 고려해 탐구 학습\n전략 점검"],["⑧\n영어 등급별\n점수 변화","영어 4등급(85점), 5등급(60점)으로 변경.\n4등급과 5등급 사이 점수 차가 25점으로 큼.","정시 지원자는 영어 4등급 이내 유지가 중요.\n영어 등급 하락이 총점에 미치는 영향을\n사전에 계산"],["⑨\n학교폭력\n조치사항 반영","수시ㆍ정시 전형에 학교폭력 조치사항이 반영되며,\n일부 조치는 부적격 처리됨.","해당 학생은 감점 및 지원 가능 여부를 사전\n에 반드시 확인"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u024","name":"아주대","region":"수원","category":"seoul","categoryLabel":"서울지역대학","pageRange":"76~78","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 총 모집인원 2,217명\n• 수시 66.3%(1,469명)/ 정시 33.7%(748명)\n• 2028 통합ㆍ융합형 수능 적용 – 탐구 사/과 구분 유지\n• 고교학점제ㆍ성취평가제 전면 적용 첫 수험생","모집 인원 비율\n큰 변화 없음"],["수시","① [학생부교과]\n- 전형요소 변경: 교과100 → 학생부교과 90+출결 10\n(석차등급80+성취도20, 사과 융합선택 5과목까지 성취도100)\n- 지원자격 변경: 졸업예정자만 지원 가능\n- 수능최저 변경: 인문 2합 5 → 2합 6\n② [학생부종합]\n- 전형변경: 종합(ACE), 종합(첨단융합인재)\n→ 종합(ACE 면접형), 종합(ACE 서류형)\n- 종합(ACE 면접형) 1단계 서류100(4배수) 2단계 서류70+면접30\n- 종 der":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n농어촌학생\n전형 변화","· 농어촌학생 전형 변경\n2027학년도 – 학생부교과\n2028학년도 – 학생부종합\n· 단순 내신 중심 지원 전략이 어려워짐.","· 농어촌학생 지원자는\n학생부 서류 경쟁력 확인\n· 교과성적뿐 아니라 진로활동, 세특,\n공동체활동 점검"],["②\n5등급제\n석차등급 반영","· 석차 등급 산출 과목 등급 점수가 5등급제로 전환됨.\n· 1등급 100점, 2등급 90점, 3등급 80점, 4등급 70점,\n5등급 0점 구조.\n· 4등급과 5등급의 점수 차가 매우 큼.","· 단순 평균등급보다 5등급 과목 발생\n여부 확인\n· 5등급 과목이 있는 학생은 환산점수\n급락 가능성 안내"],["③\n진로·융합선택\n과목 반영","· 2028학년도에는 진로 선택 뿐 아니라 융합 선택과목도 반영\n· 성취도 상위 과목을 등급 점수화하여 반영.\n· 일괄 선발 교과 전형 기준 15점 반영으로,\n비중은 크지 않지만 동점권에서 영향 가능.","· A/B/C/D/E 성취도 분포 확인\n· 상위 성취도 과목이 충분한지 확인\n· 융합선택과목도 관리 대상에 포함"],["④\n출결 100점 반영","· 학생부교과 일괄선발 전형에서 출결이 100점 반영됨.\n· 미인정 결석, 지각, 조퇴, 결과가 불리하게 작용 가능.\n· 결석일수 21일 이상은 기본점수만 반영.","· 미인정 출결 기록 반드시 확인\n· 내신이 비슷한 학생 간 출결로\n유불리 발생 가능성 안내"],["⑤\n반영교과 변화","· 2028학년도 교과전형은 국어·영어·수학·사회·과학 중심반영.\n· 한국사는 반영교과에서 제외되는 구조로 제시됨.\n· 인문대학은 외국어/한문 교과군 반영.","· 희망 모집단위별 반영교과 확인\n· 인문대학 지원자는 외국어/한문\n성적도 점검"],["⑥\n수능 응시\n지정영역 폐지","· 수능최저에서 지정 영역이 폐지됨.\n· 영역 조합의 유연성이 커짐.\n· 수능 응시 지정 영역은 폐지\n- 의과대학ㆍ치의학전문대학원은 수학과 탐구 2과목 평균\n포함 3개 영역 합을 적용하고,\n- 수의과대학ㆍ약학대학은 수학 포함 3개 영역 합 및 탐구\n2과목 평균을 적용하므로 의약학 계열은 별도 확인이\n필요함.","· 학생별 강점 영역 중심으로 최저\n충족 조합 시뮬레이션"],["⑦\n탐구 반영 방식","· 수능최저 적용 시 일반 모집단위는 탐구 2과목 중 높은 1과\n목 반영.\n· 수의과대학, 약학대학, 의과대학, 치의학전문대학원은 탐구 2\n과목 평균 반영.","· 의약학계열 지원자는 탐구 한 과목\n만 잘해서는 부족할 수 있음\n· 탐구 2과목 균형 관리 필요"],["⑧\n지역인재 자격","· 지역인재는 호남지역 고교 이수 요건이 핵심.\n· 의과대학ㆍ치과대학ㆍ약학대학ㆍ간호대학 지원자는\n2022학년도 이후 중학교 입학자의 경우 중학교 재학·거주\n요건도 확인 필요.","· 중학교 입학연도 확인\n· 중학교·고등학교 소재지 및 거주\n이력 확인"],["⑨\n학종 Ⅰ·Ⅱ 구분","· 고교생활우수자Ⅰ은 단계별 전형이며 일부 모집단위\n수능최저 적용.\n· 고교생활우수자Ⅱ는 서류 100% 일괄선발, 수능최저 미적용.\n· 면접형은 2단계에서 면접 30% 반영.","· 수능 최저 가능 학생\n- 고교생활우수자Ⅰ 검토\n· 서류 경쟁력 중심 학생\n- 고교생활우수자Ⅱ 검토\n· 면접형은 학생부 기반 답변 준비"],["⑩\n정시\n표준점수 전환","· 정시는 영어와 한국사를 제외하고 표준점수로 통일.\n· 영어 등급 간 점수 차는 기존 10점에서 5점으로 축소.\n· 탐구 2과목 반영에 따른 탐구 반영 비율 축소도 제시됨.","· 정시는 백분위 평균이 아니라\n표준점수 기준으로 판단\n· 영어보다 국어·수학·탐구 표준점수\n영향력 확인"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u029","name":"충북대","region":"청주","category":"national","categoryLabel":"국가거점국립대학","pageRange":"94~97","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","① 2028 대입제도 개편에 따라 학교생활기록부 교과성적 반영방법이 변경됨.\n② 전형 전체에서 학교폭력 조치 사항 반영이 강화됨.\n③ 학교폭력 조치 사항은 전 대학입학전형에서 각 호수에 따라 실질반영점수\n의 10~50% 감점 또는 부적격 처리됨.\n④ SW우수인재전형은 2028학년도에 선발하지 않음.","교과 산출ㆍ학폭\n반영 변화 주의"],["수시","① 학생부교과전형은 학생부교과 100% 일괄 합산 구조가 중심임.\n② 학생부종합Ⅰ은 수능최저 미적용, 학생부종합Ⅱ는 수능최저 적용.\n③ 간호대학 수시 수능최저가 변경됨.\n- 학생부종합Ⅱㆍ학생부교과ㆍ지역인재: 기존 2개 등급 합 6 이내\n→ 2028학년도 상위 3개 등급 합 10 이내\n- 지역경제배려대상자: 기존 2개 등급 합 7 이내\n→ 2028학년도 상위 3개 등급 합 11 이내\n④ 지역 의사 선발 특별전형이 신설ㆍ운영되며, 청주권ㆍ충주권ㆍ제천권ㆍ광\n역권으로 나뉨.","간호 최저 변화,\n지역의사 신설 주의"],["정시","① 정시는 수능 위주 일반전형과 지역인재, 지역의사, 경제 배려, 실기 전형\n등으로 운영됨.\n② 수시 미충원 인원은 전형 성격에 따라 정시 일반 또는 해당 정원외ㆍ지역\n인재ㆍ지역 의사 전형으로 이월됨.\n③ 정시 지역의사전형도 의예과 중심으로 운영됨.","수시 이월 방식\n확인 필요"]],"hasHeader":true}]},{"num":"2","title":"수시(교과, 학종) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","① 전형방법\n- 학생부교과전형, 지역인재전형, 지역 경제 배려 대상자 전형, 지역 의사 전형은\n학생부 교과 100% 일괄 합산\n- 국가보훈대상자전형, 경제배려대상자전형도 학생부 교과 100%이나 수능 최저 미적용\n- 특성화고출신자전형, 특수교육대상자전형도 학생부 교과 100%, 수능 최저 미적용\n② 반영 교과\n- 1ㆍ2ㆍ3학년 전 계열 공통으로 국어, 영어, 수학, 사회, 과학 반영\n- 해당 교과 전 과목 반영\n- 2028년 2월 이전 졸업 예정자는 3학년 1학기까지 성적 반영\n③ 성취도 반영 방식\n- 2028학년도 이후 졸업 예정자는 성취도와 석차 등급을 모두 활용함.\n- 성취도 및 석차 등급 기재 과목은 성취도 점수 + 석차 등급 점수를 합산하여 과목별 점수를 산출함.\n- 성취도 점수: A 5점, B 4.5점, C 3.5점, D 1.5점, E 0점\n- 석차 등급 점수: 1등급 5점, 2등급 4점, 3등급 3점, 4등급 1점, 5등급 0점\n- 예: 석차 등급 1등급 + 성취도 B이면 5점 + 4.5점 = 9.5점\n- 따라서 같은 석차 등급이라도 성취도에 따라 환산 점수가 달라짐.\n④ 석차 등급 미기재 과목\n- 석차 등급이 없는 과목은 성취도 및 성취도별 분포 비율을 활용하여 산출\n- 성취도별 분포 비율이 미표기되는 경우 교과성적을 산출하지 않음\n- A는 학생 비율과 관계없이 1등급 해당 점수를 부여하고, B~E는 누적 비율에 따라 점수를 부여함."]],"hasHeader":true},{"type":"table","rows":[["","⑤ 수능 최저\n- 학생부 교과, 지역인재, 지역 경제배려, 지역 의사전형은 수능최저 적용\n- 국가보훈대상자, 경제 배려대상자는 수능 최저 미적용\n- 기본적으로 국어ㆍ수학ㆍ영어ㆍ탐구 중 상위 2개 영역 등급 합 충족\n- 수의과대학ㆍ약학대학ㆍ의과대학ㆍ간호대학은 상위 3개 영역 등급 합 충족\n- 자연계 모집단위는 수학 필수 반영이 원칙이나, 농업생명환경대ㆍ생활과학대학ㆍ수의과대학\n간호대학ㆍ창의융합대학ㆍ자연과학자율전공계열은 수학 필수 미반영"],["수시\n(학종)\n서류, 면접","① 학생부종합Ⅰ\n- 서류 평가 100% 일괄 합산ㆍ수능 최저 미적용\n② 학생부종합Ⅱ\n- 서류 평가 100% 일괄 합산ㆍ수능 최저 적용\n③ 농어촌 학생전형\n- 정원 외 학생부 종합ㆍ서류 평가 100% 일괄 합산ㆍ수능 최저 미적용\n④ 서류 평가 관련\n- 시행계획에는 세부 평가 요소별 배점은 구체적으로 제시되지 않음.\n- 학교생활기록부 기반 정성평가로 이해하면 됨.\n- 학교폭력 관련 기재 사항이 있을 경우 각 호수에 따라 부적격 또는 감점 처리됨."]],"hasHeader":false}]},{"num":"3","title":"대학별 지향 인재상 및 서류 평가 요소, 권장 이수 과목","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","대학 헌장에서 제시한 교육목표와 기본정신을 충실히 이해하고, 실천할 수 있는 높은 역량을 갖춘\n인재인 “직지의 창의 정신을 품은 개신인”으로서, 건학이념에 따라, 진리인, 정의인, 개척인을 지향함\n6대 핵심역량 : 창의성, 휴머니즘, 능동성, 공동체, 글로벌, 전문성"],["서류\n평가 요소","① 학업적 역량\n- 전체교과의 학업적 노력과 성취도 – 전공관련 교과 이수노력 및 교과 성취도\n- 전공 관련 진로탐색 활동과 경험 – 학습태도 및 학업의지\n② 사회적 역량\n- 나눔과 배려 – 성실성과 규칙준수 – 협업과 소통능력"],["권장\n이수 과목","모집단위 과목선택 모집단위 과목선택\n[농업생명환경대학]\n[수의과대학],[약학대학]\n[농업경제학과]\n영어, 수학 [의과대학],[간호대학], 영어, 과학\n[심리학과]\n[창의융합대학]\n[경제학과]\n농업생명환경대학\n[농업경제학과 제외 모집단위]\n[영어교육과] 영어, 국어 [자연과학대학] 수학, 과학\n[공과대학]\n[전자정보대학]\n[물리교육과],[화학교육과]\n[중어중문학과]\n[수학교육과],[생물교육과], 사회, 영어,\n수학, 과학 [영어영문학과]\n[지구과학교육과] 제2외국어\n[독일언어문화학과]\n[식품영양학과]\n[프랑스언어문화학과]\n[국어국문학과]\n[철학과] [사학과] [교육학과]\n[고고미술사학과] 국어, 사회 [사회과학대학] [사회학과]\n영어, 사회\n[국어교육과],[역사교육과] (역사/도덕 포함) [행정학과] [정치외교학과]\n(역사/도덕 포함)\n[지리교육과],[사회교육과] [경영대학] [경영학부]\n[소비자학과],[윤리교육과] [국제경영학과] [경영정보학과]\n[아동복지학과]\n국어, 영어, 사회,과학\n[러시아언어문화학과] [의류학과] 주거환경학과]\n제2외국어 (역사/도덕 포함),"]],"hasHeader":true}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["수능 유형","반영 방식 및 배점","특이사항"],["①\n수능 일반","① 가ㆍ나ㆍ다군 일반전형 중심으로 운영.\n② 수시 학생부종합Ⅰ·Ⅱ, 학생부교과, 지역인재, 국가보훈, 경제배려\n등의 미충원 인원은 정시 일반전형으로 이월 가능.\n③ 정시 인문계열은 국어 30%, 수학 20%, 영어 20%, 탐구 30%, 자\n연계열은 국어 20%, 수학 30%, 영어 20%, 탐구 30%를 반영함.\n점수산출 활용지표는 국어·수학·탐구 표준점수, 영어 절대평가 등\n급임.\n④ 정시 탐구는 사회ㆍ과학탐구 점수를 분리하여 반영하며, 인문계\n열은 사회 20%와 과학 10%, 자연계열은 사회 10%와 과학 20%,\n예체능계열은 사회 20%와 과학 20%를 적용함.","· 수시 이월 규모에 따라 정시\n선발 구조 변동 가능"],["②\n수능 지역인재","① 수시 지역인재전형의 수의과대학, 약학대학, 의과대학, 간호대\n학 미충원 인원은 정시 지역인재전형으로 이월.\n② 지역인재 지원자격은 수시 학생부교과 지역인재전형과 동일하\n게 충청권 고교 이수 요건을 중심으로 확인해야 함.","· 의약학ㆍ간호계열 지역인재\n자격 확인 필수"],["③\n수능 지역의사","① 수시 지역의사전형 미충원 인원은 정시 지역의사진료권 또는\n지역의사광역권 전형으로 이월.\n② 의예과 입학 후 충청북도 해당 진료권 또는 광역권에서 10년간\n의무복무하는 조건이 있음.","· 일반 지역인재와 구분 필요\n· 의무복무 조건 안내 필수"],["④\n실기/실적","① 수시 실기우수자전형 미충원 인원은 정시 실기/실적 나군 일반\n전형으로 이월.\n② 예술계열은 실기 영향이 큼.","· 실기 준비 학생은 수시ㆍ\n정시 이월 가능성\n확인"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n교과 성취도 반영","· 충북대는 교과성적 산출에서 석차등급과 성취도를 함께 반영함\n· 성취도 A 5점, B 4.5점, C 3.5점, D 1.5점, E 0점.\n· 석차등급 1등급 5점, 2등급 4점, 3등급 3점, 4등급 1점, 5등급 0점.\n· 같은 석차등급이라도 성취도에 따라 점수 차이가 발생함.","· 단순 석차등급 평균만 보\n지 말고 석차등급 + 성취\n도 조합으로 환산\n· 성취도 C 이하, 특히 D/E\n과목 여부 확인"],["②\n석차등급 미기재\n과목 처리","· 석차등급이 없는 과목은 성취도와 성취도별 분포비율로 산출함.·\n성취도별 분포비율이 없으면 교과성적 산출 불가.","· 진로선택ㆍ성취도 과목의\n분포비율 기재 여부 확인\n· A/B/C 성취도만 볼 것이\n아니라 해당 성취도 학생\n비율도 확인"],["③\n반영교과 전 과목","· 국어ㆍ영어ㆍ수학ㆍ사회ㆍ과학 해당 교과 전 과목 반영.· 일부\n우수 과목만 골라 반영하는 방식이 아님.","· 특정 과목 약점이 환산점\n수에 반영될 수 있음\n· 주요 5개 교과 전체 성적\n흐름 점검"],["④\n간호대학\n수능최저 변화","· 간호대학은 수능 최저가 2028학년도에 상위 3개 영역 등급 합\n구조로 변경됨.\n· 학생부종합Ⅱㆍ학생부교과ㆍ지역인재는 상위 3개 등급 합 10 이내.\n· 지역경제배려대상자는 상위 3개 등급 합 11 이내.","· 간호 지원자는 2개 영역\n중심이 아니라 3개 영역\n관리 필요\n· 수능최저 충족 가능성 별\n도 시뮬레이션"],["⑤\n수능최저 반영영역\n응시 조건","· 수능최저 반영 시 해당 모집단위의 수능 반영 영역 전 영역에\n응시해야 함.\n· 한국사는 필수 응시이나 등급 합에는 미포함.","· 최저에 쓰지 않는 영역도\n응시 누락 시 문제될 수\n있음\n· 수능 원서 작성 단계에서\n영역 선택 확인"]],"hasHeader":true},{"type":"table","rows":[["⑥\n자연계\n수학 필수 조건","· 자연계 모집단위는 수학 필수 반영이 원칙.\n· 단, 농업생명환경대학, 생활과학대학, 수의과대학, 간호대학, 창의\n융합대학 자연과학자율전공계열은 수학 필수 미반영.","· 자연계 지원자는 수학 필\n수 여부를 모집단위별로\n구분· 수학이 약한 학생은\n예외 모집단위 검토"],["⑦\n지역인재 자격","· 지역인재는 충청권, 충북ㆍ세종ㆍ대전ㆍ충남, 고교 전 과정 이수\n요건이 핵심.\n· 2022학년도 이후 중학교 입학자 중 약학과, 제약학과, 의예과,\n간호학과 지원자는 비수도권 중학교 이수ㆍ거주 요건도 충족해\n야 함.","· 중학교 입학년도 확인·\n중·고교 소재지와 거주\n이력 점검"],["⑧\n지역 의사선발","· 지역의사전형은 청주권, 충주권, 제천권, 광역권으로 구분.\n· 의예과 입학 후 해당 지역에서 10년간 의무복무 조건이 있음.","· 단순 의대 합격 가능성만\n보지 말고 의무복무 조건\n안내\n· 해당 진료권 지원자격과\n거주 요건 확인"],["⑨\nSW 우수인재전형\n미선발","· 2028학년도에는 SW우수인재전형을 선발하지 않음.","· SW 관련 학생은 학생부\n종합ⅠㆍⅡ 또는 교과전형\n등 다른 전형으로 전략\n전환"]],"hasHeader":false},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u030","name":"충남대","region":"대전","category":"national","categoryLabel":"국가거점국립대학","pageRange":"98~101","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","① 전체 모집인원은 수시 3,319명, 정시 777명, 전형 기간 자율화 74명으\n로 구성됨.\n② 2028학년도에는 고교학점제 및 2022 개정 교육과정 적용에 따라 학생\n부 교과성적 산출 방식이 변경됨.\n③ 학교폭력 조치사항 가해 학생에 대한 불이익이 수시ㆍ정시ㆍ추가모집\n전 전형에 강화 적용됨.","학생부 교과 반영 방식과\n학교폭력 조치사항 감점\n기준 반드시 확인"],["수시","① 학생부교과 일반ㆍ지역인재전형에서 의예과ㆍ수의예과ㆍ약학과 학생부\n정성평가 20% 반영\n② 수능최저학력기준 이 일부 모집단위에서 3개 영역 합산\n→ 상위 2개 영역 합산 방식으로 변경 됨. 단, 의예과ㆍ수의예과ㆍ약학\n과는 별도 기준 유지\n③ 학생부교과전형 교과성적 산출 시 상대평가 등급(5등급)과 절대평가 성\n취도 등급(A~E)을 혼합 반영\n④ 지역 의사 선발전형 모집인원\n2027학년도 27명 → 2028학년도 33명으로 확대","의ㆍ약학계열 교과 전형\n에서 단순 교과점수만이\n아니라 과목 선택 및 이\n수 충실도가 중요.\n학생부 종합 지원자는\n모집단위별 권장 이수\n과목 확인 필요"],["정시","① 정시 수능 위주 전형에서 학생부 성적 20% 반영\n: 수능 80% + 교과 15% + 비교과 출결 5%\n② 모집단위별 수능 반영 영역 및 영역별 반영 비율 변경","수능 100%가 아니므로\n학생부 교과·출결 관리가\n정시에서도 영향력"]],"hasHeader":true}]},{"num":"2","title":"수시(교과, 학종) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","[학생부교과(일반)] 국내 고교 졸업(예정)자 등 지원 가능.\n대부분 모집단위는 교과 100%으로 선발하며 수능최저학력기준을 적용함.\n단, 의예과ㆍ수의예과ㆍ약학과는 교과 80% + 학생부 정성평가 20%를 반영 함.\n사범대학 일부 모집단위\n국어교육과ㆍ영어교육과ㆍ기술교육과는 1단계 교과 100%, 2단계 교과 80% + 면접 20%로 선발함.\n자연과학대학, 공과대학, 사범대학(자연계열 학과), 생명시스템과학대학, 농생명융합학부, 공학융합학부,\n자연과학융합학부는 상위 2개 영역 합산 시 수학 필수 반영.\n[학생부교과(지역인재)]\n충청권(대전ㆍ충남ㆍ충북ㆍ세종) 소재 고교 전 교육과정 이수자를 대상으로 하며, 의예과ㆍ약학과ㆍ간\n호학과는 중학교 및 고등학교 소재·거주 요건을 함께 확인해야 함. 전형 방법은 일반전형과 동일.\n[학생부교과(지역인재 저소득층학생)] 충청권 고교 이수 요건과 저소득층 자격을 함께 충족해야 하며,\n수능최저학력기준(의과대학 합산 6등급 이내, 약학대학 7등급 이내, 간호대학 7등급 이내)을 적용함.\n[학생부교과(기회균형선발Ⅰ)] 국가보훈대상자, 서해5도, 농어촌학생, 저소득층, 자립지원대상자 등을 대\n상으로 하며, 교과 100% 일괄사정, 수능최저 미적용 전형임. 국가보훈·저소득층·자립지원대상자에 한해\n검정고시 출신자 지원 가능"],["수시\n(학종)\n서류, 면접","[학생부종합Ⅰ(면접)] 1단계 서류 100%, 2단계 서류 약 66.7% + 면접 약 33.3%로 선발함.\n수능최저학력기준: 사범대학(국어교육과, 영어교육과, 교육학과, 수학교육과, 기술교육과) 국어, 수학, 영\n어, 탐구(1과목) 중 상위 2개 영역 합산 6등급 이내 / 사범대학(건설공학교육과, 기계공학교육과, 전기·\n전자·통신공학교육과, 화학공학교육과), 간호대학 상위 2개 영역 합산 7등급 이내 / 의과대학 국어, 영\n어, 탐구(2과목 평균) 중 상위 2개영역과 수학합산 5등급 이내 / 약학대학 상위 2개영역과 수학합산 6"]],"hasHeader":true},{"type":"table","rows":[["","등급 이내 / 수의과대학 상위 2개영역과 수학합산 7등급 이내\n[학생부종합Ⅰ(서류)] 서류평가 100% 일괄합산 전형.\n수능최저학력기준: 간호대학 국어, 수학, 영어, 탐구(1과목) 중 상위 2개 영역 합산 7등급 이내 / 의과\n대학 국어, 영어, 탐구(2과목 평균) 중 상위 2개 영역과 수학 합산 5등급 이내 / 약학대학 상위 2개 영\n역과 수학 합산 6등급 이내 / 수의과대학 상위 2개 영역과 수학합산 7등급 이내\n[학생부종합Ⅱ(소프트웨어인재)]\n1단계 서류 100%, 2단계 서류 약 66.7% + 면접 약 33.3%, 수능최저 미적용.\n[학생부종합Ⅱ(영농창업인재)]\n1단계 서류 100%, 2단계 서류 약 66.7% + 면접 약 33.3%, 수능최저 미적용.\n[학생부종합Ⅱ(지역인재-의예과)] 충청권 고교 이수자를 대상으로 하며, 1단계 서류 100%, 2단계 서류\n약 66.7% + 면접 약 33.3%,\n수능최저(국어, 영어, 탐구(2과목 평균) 중 상위 2개영역과 수학합산 5등급 이내) 적용.\n[학생부종합Ⅱ(지역의사선발)] 의예과 입학 후 의사면허 취득 및 해당 지역 10년 의무복무를 전제로\n하는 전형. 서류 100% 일괄 합산, 수능최저(국어, 영어, 탐구(2과목 평균) 중 상위 2개영역과 수학합산\n6등급 이내) 적용. 모집인원은 총 33명으로, 충남 진료권 및 충청 광역권으로 구분됨.\n[학생부종합Ⅱ(기회균형선발Ⅱ)]\n난치병력자, 다문화가족 자녀, 조손가정 손자녀, 다자녀가구 자녀 등을 대상으로 하며, 1단계 서류\n100%, 2단계 서류+면접, 수능최저 미적용.\n[학생부종합Ⅱ(국가안보융합인재)]\n국토안보학전공30명, 해양안보학전공40명. 1단계 서류100%, 2단계 서류 약 57.1% + 면접 약 28.6% +\n체력평가 약 14.3%. 수능최저 미적용. 국토안보학전공 신체검사/ 해양안보학전공 신체검사, 인성검사,\n신원조사 합·불 판정\n[학생부종합Ⅲ(고른기회 특별전형)]\n농어촌학생, 특성화고출신자, 저소득층학생, 특수교육대상자 등을 대상으로 하며, 1단계 서류 100%, 2\n단계 서류 약 66.7% + 면접 약 33.3%, 수능최저 미적용.\n서류평가는 입학사정관이 지원자의 학교생활기록부를 평가항목에 따라 독립적이고 종합적으로 평가하\n는 방식임. 면접평가는 학교생활기록부 또는 제출서류를 참고하여 평가항목에 따라 구술평가로 실시\n함. 특히 학종 면접형, 소프트웨어인재, 영농창업인재, 기회균형Ⅱ, 고른기회 특별전형 등은 면접이 2단\n계에서 약 33.3% 반영되므로 서류 기반 구술 면접 대비가 필요함."]],"hasHeader":false}]},{"num":"3","title":"대학별 지향 인재상 및 서류 평가 요소, 권장 이수 과목","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","핵심 키워드 : 교수ㆍ연구, 인재양성, 창의ㆍ개발ㆍ봉사 (출처 : 대학 홈페이지)\n국가와 인류사회의 발전에 필요한 학술의 심오한 이론과 그 응용방법을 교수ㆍ연구하는 동시에 창의\nㆍ개발ㆍ봉사정신이 풍부한 지도적 인격을 갖춘 인재를 양성"],["서류 평가\n요소","① 학생부교과 의예과·수의예과·약학과 정성평가의 경우 교과이수 충실도(과목 선택 및 이수현황, 성\n적을 고려한 정성평가) 80%, 학교생활 충실도(출결을 고려한 정성평가) 20% 반영\n② 학종 서류평가는 학교생활기록부를 평가항목에 의거하여 독립적·종합적으로 평가"],["권장 이수\n과목","【인문대학, 사범대학(국어교육과·영어교육과·교육학과)】\n국어, 영어 2과목 이상, 제2외국어/한문 1과목 이상\n【사회과학대학, 국가안보융합학부】\n국어, 영어, 사회 2과목 이상. 사회학과·심리학과·사회복지학과·행정학부는 확률과 통계\n【경상대학】\n영어 2과목 이상, 확률과 통계\n【자연과학대학】\n대수, 미적분Ⅰ, 확률과 통계. 수학과·정보통계학과·물리학과는 기하, 미적분Ⅱ. 천문우주과학과는 미적\n분Ⅱ. 과학은 진로선택과목 1과목 이상\n【공과대학】\n대수, 미적분Ⅰ, 확률과 통계, 미적분Ⅱ. 과학은 진로선택과목 1과목 이상\n【의과대학, 약학대학, 수의과대학】\n대수, 미적분Ⅰ, 확률과 통계, 기하, 미적분Ⅱ. 과학은 화학, 생명과학 및 물질과 에너지, 화학반응의 세\n계, 세포와 물질대사, 생물의 유전 중 2과목 이상\n【생활과학대학(소비자학과·의류학과)】 영어 2과목 이상"]],"hasHeader":true},{"type":"table","rows":[["","【생활과학대학(식품영양학과)】\n영어 2과목 이상, 대수, 미적분Ⅰ, 확률과 통계. 과학은 진로선택과목 1과목 이상\n【사범대학(수학교육과)】\n대수, 미적분Ⅰ, 확률과 통계, 기하, 미적분Ⅱ. 과학은 진로 또는 융합선택과목 1과목 이상\n【사범대학(건설공학교육과·기계공학교육과·전기·전자·통신공학교육과·화학공학교육과·기술교육과)】\n대수, 미적분Ⅰ, 확률과 통계. 과학은 진로선택과목 1과목 이상\n【간호대학】\n대수, 미적분Ⅰ, 확률과 통계. 과학은 생명과학 및 세포와 물질대사, 생물의 유전 중 1과목 이상\n【생명시스템과학대학】\n대수, 미적분Ⅰ, 확률과 통계, 미적분Ⅱ. 과학은 화학, 생명과학 및 물질과 에너지, 화학반응의 세계, 세\n포와 물질대사, 생물의 유전 중 2과목 이상\n【지식융합학부】 영어 2과목 이상, 확률과 통계\n【국제학부】 영어 3과목 이상\n【인문사회융합학부】\n국어, 영어, 사회 2과목 이상. 확률과 통계\n【자연과학융합학부】\n대수, 미적분Ⅰ, 확률과 통계. 과학은 진로선택과목 1과목 이상\n【공학융합학부】\n대수, 미적분Ⅰ, 확률과 통계, 미적분Ⅱ. 과학은 진로선택과목 1과목 이상\n【영농창업인재전형 농업생명과학대학(농업경제학과)】\n영어, 사회 2과목 이상, 확률과 통계\n【영농창업인재전형 농업생명과학대학(원예학과·생물환경화학과)】\n영어 2과목 이상, 수학은 대수, 미적분Ⅰ, 확률과 통계. 과학은 진로선택과목 1과목 이상\n【농생명융합학부(농업경제학과 진로희망자 제외)】\n대수, 미적분Ⅰ, 확률과 통계, 기하, 미적분Ⅱ. 과학은 진로선택과목 1과목 이상\n【농생명융합학부(농업경제학과 진로희망자)】 영어, 사회 2과목 이상. 확률과 통계"]],"hasHeader":false}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["수능 유형","반영 방식 및 배점","특이사항"],["정시 수능(일반)\n가·나군","[전 모집단위]\n수능 80% + 학생부 교과 15% + 비교과 출결 5% 반영.\n[체육교육과]\n1단계 : 수능 80% + 교과 15% + 출결 5%,\n2단계 : 수능 65% + 교과 7.5% + 출결 2.5% + 실기 25%","정시 일반전형 -\n학생부 20% 반영.\n내신과 출결이 정시 지원\n전략에 영향을 줄 수 있음"],["정시\n수능(지역인재·지역인\n재 저소득층학생)","수시모집 지역인재ㆍ지역인재 저소득층 지원 자격과 동일.\n수능 80% + 교과 15% + 출결 5% 반영.\n지역인재 저소득층은 수시 미충원 이월 발생 시 선발","충청권 학생의 경우\n정시에서도 지역인재 지원 가\n능성을 확인할 필요가 있음"],["정시\n수능(지역의사선발)","수시모집 지역의사선발 지원 자격과 동일.\n수능 80% + 교과 15% + 출결 5% 반영.\n수시 미충원 이월 인원 발생 시 선발.","의예과 지역의사선발은\n의무복무 조건과 출신 지역\n요건을 반드시 확인해야 함"],["정시 수능\n(농어촌학생·저소득층학생)","수시모집 농어촌학생·저소득층학생 지원 자격과 동일.\n수시 미충원 이월 발생 시 선발.\n수능 80% + 교과 15% + 출결 5% 반영.","농어촌ㆍ저소득층\n정시 지원자는 이월 여부와\n학생부 반영을 함께 확인해\n야 함"],["정시\n수능(국가안보융합)","수시모집 학생부종합Ⅱ 국가안보융합인재 지원자격과 동일\n해양안보학전공 : 수능 최저 국어, 영어, 수학, 탐구(1과목) 중\n상위 3개 영역 합산 11등급 이내","국토안보학전공 및\n해양안보학전공\n수시모집 미충원으로 인한\n이월 발생 시 선발"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n정시 학생부 반영","2028학년도 정시 수능위주 전형에서\n수능 80% + 교과 15% + 출결 5% 반영","정시 지원 희망 학생도 내신과 출결을\n끝까지 관리하도록 지도"],["②\n의·약학계열\n교과전형 정성평가","의예과ㆍ수의예과ㆍ약학과 학생부교과 일반ㆍ지역\n인재전형에서 교과 80% + 학생부 정성평가 20%\n반영","단순 내신 등급만 보지 말고 수학ㆍ과학\n과목 선택, 이수 충실도, 성취도 분포를 함께\n점검"],["③\n수능최저 방식 변화","다수 모집단위에서 수능 최저가 상위 2개 영역\n합산 방식으로 제시됨.\n단, 의예과ㆍ약학과·수의예과는 별도 기준 적용","일반 모집단위와 의ㆍ약학계열 수능최저를\n구분하여 안내. 자연계열은 일부 모집단위\n에서 수학 필수 반영 여부 확인"],["④\n지역인재 지원 자격","지역인재는 충청권 고교 전 교육과정 이수 요건\n이 핵심. 의예과·약학과·간호학과는 중학교 소재\n및 거주 요건도 확인 필요","충청권 학생이라도 세부 지원 자격이 다\n를 수 있으므로 중ㆍ고교 재학 지역과 거\n주 요건을 조기 확인"],["⑤\n지역의사선발\n전형 확대","지역의사선발 모집인원이 2027학년도 27명에서\n2028학년도 33명으로 증가","의예과 지원자 중 충남 진료권 또는 충청권\n요건 충족 학생에게 별도 안내.\n단, 10년 의무복무 조건을 반드시 설명"],["⑥\n학생부교과\n성적 산출 변화","상대평가 석차등급과 절대평가 성취도 등급을 혼\n합 반영.\n5등급제 석차등급과 A~E 성취도 환산점수 적용","과목 선택 시 과목 이수 자체뿐 아니라\n성취도 관리가 중요함을 안내"],["⑦\n학종 면접 반영","학종 면접형, 소프트웨어인재, 영농창업인재, 기\n회균형Ⅱ, 고른기회 등은 2단계에서 면접 약\n33.3% 반영","학생부 기반 구술 면접 대비 필요. 활동\n나열보다 전공 관심, 과목 선택 이유, 탐\n구 과정 설명 연습 필요"],["⑧\n학교폭력\n조치사항 반영","전 전형에 학교폭력 조치사항 감점 적용. 1~3호\n는 전형총점 10%,\n4~5호는 30%,\n6~7호는 50% 감점, 8~9호는 사정 제외","학생부 마감 전 생활지도와 학생부\n기재사항 확인 필요.\n감점 폭이 커서 지원 가능성에 직접 영향"],["⑨\n계열별\n수능 반영 비율","인문계는 국어 40% / 자연계는 수학 40%, 자율\n전공융합학부는 국어·수학 각 35% 반영","정시 지원 시 학생의 강점 영역에 따라 계열\n및 모집 단위 선택 전략을 세분화"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailin 에 높은 반영비율 적용\n• 교과서 지문 활용 현장 녹화 면접","단순 내신 평균이 아닌\n계열별 핵심교과 성적 확인 필요\n→ 자연계는 수학·과학, 인문계는\n국어·영어·사회 중심으로\n→ 교과 개념과 제시문을 근거로\n사고과정을 설명하는 면접 준비"],["③\n학생부종합\n서류전형 신설","• 463명 선발\n• 서류평가100%, 면접 없음\n• 학업40+탐구40+사회20\n• 수능최저 적용","면접 부담 없이 학종 지원 가능\n→ 학생부 경쟁력과 수능최저 충족\n가능성을 동시에 검토"],["④\n면접전형·면접지역\n전형 면접 비중 확대","• 2027: 서류80+면접20\n• 2028: 서류70+면접30\n• 서류평가에서 탐구역량50% 반영","학생부에 기록된 탐구활동의 과정과\n내용을 설명할 수 있도록 준비\n→ 탐구활동의 연속성·구체성·교과\n기반 사고를 중심으로 학생부와\n면접을 함께 준비"],["⑤\n교과전형\n학업역량평가20%\n반영","• 교과우수·교과지역·농어촌·지역저소득층전형: 학생\n부교과80%+학업역량평가20%\n• 교육과정 이수 충실성, 과목선택 적절성, 학교생\n활 성실성 평가\n• 변환점수: 100 / 98 / 95 / 90 / 0","교과전형을 단순 내신 정량전형으로\n판단하지 않도록 주의\n→ 모집단위와 연계된 과목 선택 및\n출결을 포함한 학교생활 관리 필요"],["⑥\n정시 학업충실도평가\n전 모집단위 확대","• 실기 모집단위를 제외한 일반 모집단위\n• 수능80%+학업충실도평가20%\n• 교과 이수 노력·성취수준·출결 등을 평가","정시 지원자도 학생부 관리 필요\n→ 수능점수만으로 정시 지원\n가능성을 판단하지 않고 교과 이수\n및 학교생활 기록을 함께 검토"],["⑦ 지역전형\n지원자격 확인","• 교과지역·면접지역·수능지역전형: 부산·울산·경남\n소재 고교 전 교육과정 이수 필요\n• 간호학과·약학부·의예과·치의예과 등은 대상자에\n따라 중학교 재학 및 거주요건 추가","중·고교 소재지 및 재학·거주기간을\n우선 확인"],["⑧\n지역의사선발전형\n38명 모집","• 의예과 38명: 광역권12명+진료권26명\n• 중·고교 재학·거주지역에 따른 지원자격\n• 수학 포함 3개 영역 합4\n• 복무형 지역의사 제도 적용","일반 지역인재 의예과와 구분\n→ 지원자격, 선발 지역 및 의무복무\n조건을 반드시 확인한 후 지원"],["⑨\n부산대-부산교대\n통합에 따른\n기본계획 수정 예정","• 통합대학 출범: 2027. 3. 1.\n• 기존 부산교대에 해당하는 단과대학은 교육대학\n으로 운영\n• 통합 후 학칙에 따라 2028학년도 기본계획 수정\n예정","교육계열 지원자는 현재 기본계획을\n최종안으로 판단하지 않도록 주의\n→ 수정 기본계획 및 최종 모집요강\n반드시 재확인"],["⑩\n모집단위별\n권장 이수 과목 확인","• 모집단위별로 수학·과학 교과의 최소 이수 권장과\n목을 제시\n• 학생부교과전형의 학업역량평가에서 모집단위별\n과목선택의 적절성을 평가\n• 교과별 과목 위계를 고려한 이수를 권장","지원 희망 모집단위의 권장 이수\n과목을 고교 과목 선택 단계부터 확인\n→ 자연·공학·의약학계열은 수학, 과학\n교과의 과목 수뿐만 아니라 교과\n위계를 고려한 이수 여부 점검"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u033","name":"전주교대","region":"전주","category":"regional","categoryLabel":"지역대학","pageRange":"112~114","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 학교폭력 조치사항 감점 폭 확대 - 1호 70점→100점, 2호 105점→150\n점, 3호 140점→200점(1단계 서류평가 점수 기준, 4~9호는 기존과 동일\n하게 부적격 처리)",""],["수시","• 고른기회Ⅱ에 만학도전형 신설(정원외 10명 추가)\n• 지역인재선발 114명→115명(2026학년도 정원 내 1명 미충원 인원 이월\n분 반영)\n• 수시 모집인원 총계 195명→206명으로 증가(정원내 172→173명, 정원\n외 23→33명)",""],["정시","• 만학도전형이 정시모집(정원외)에도 신설되어 5명 배정됨\n(2027학년도 수시 모집 요강에는 정시 관련 내용이 없어 정시 전체의\n직접 비교는 어려우나, 만학도 전형 자체가 2028학년도 신설임은 확인됨)",""]],"hasHeader":true}]},{"num":"2","title":"수시(교과,학종,논술) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","학생부 교과 전형 미실시(모집유형에 학생부 교과 전형 없음)"],["수시\n(학종)\n서류, 면접","• 교직적성우수자(48명), 지역인재선발(115명), 고른기회Ⅰ(국가보훈대상자 5명, 다문화가정자녀 5명),\n고른기회Ⅱ(농어촌학생11명, 기회균형선발4명, 장애인등대상자 8명, 만학도전형 10명) 7개 세부전형 운영.\n• 수능최저학력기준 미적용.\n• 1단계 서류평가 100%(전형별 선발배수 상이: 교직적성우수자 약 4배수, 지역인재선발 약 3배수, 고른\n기회Ⅰ 약 2배수) → 2단계\n• 1단계 성적 70%(700점)+면접 30%(300점)=100%(1,000점).\n• 학교폭력 조치 사항은 1~3호 1단계 점수에서 100~200점 차등 감점, 4~9호는 부적격(지원자격 제한)."],["수시(논술)","논술전형 미실시(모집유형에 논술전형 없음)"]],"hasHeader":true}]},{"num":"3","title":"대학별 지향 인재상 및 서류 평가 요소, 권장 이수 과목","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","• 예비 초등교사로서의 자질, 교직적성 확인 및 우수 교사로서의 잠재능력"],["서류 평가\n요소","• 지성, 인성, 창의 3개 영역을 정성 종합평가(교직적성우수자/지역인재선발/국가보훈대상자/다문화\n가정자녀 전형은 반영 비율 명시, 그 외 전형은 비율 미기재)"]],"hasHeader":true},{"type":"table","rows":[["","- 지성영역(40%): 학업능력, 학업성취도, 자기주도 학습능력, 탐구능력 등\n- 인성영역(40%): 리더십, 봉사정신, 소통공감력, 책임감 및 성실성, 교직적합성 등\n- 창의영역(20%): 창의적 사고력, 자기주도력, 성장가능성, 도전정신 등\n• 서류평가 방법\n- 1명당 3인의 입학사정관이 학생부를 바탕으로 종합평가하며, 학교폭력 조치사항(1~9호)에 따라 감점\n또는 지원 자격 제한이 적용됨."],["권장 이수\n과목","• 초등교육과 단일 모집단위라 학과별 권장이수과목표 안내 없음. 전 과목 중요함."]],"hasHeader":false}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["수능 전형 안내","반영 방식 및 배점","특이사항"],["반영영역·비율","• 1단계 수능성적 100%(900점): 국어 25%, 수학 25%, 영어\n25%, 탐구(사회+과학 2과목 평균) 25%, 국어·수학·탐구는 백\n분위, 영어는 등급 활용. 계열 구분 없이 전 전형(일반학생,\n고른기회Ⅱ) 공통 적용","수능최저학력기준\n미적용(전 전형 공통)"],["2단계·면접","• 2단계: 1단계 성적 90% 환산(900점)+면접 10%(100점)=100%\n(1,000점)","영어 등급별 환산점수"],["학교폭력 반영","• 학교폭력 조치사항 반영 – 1호 100점, 2호 150점, 3호 200\n점 감점(1단계 점수 기준)","4~9호는 부적격처리되어\n지원자격 자체가 제한됨\n(수시와 동일 기준)"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n학생부교과 부재","• 전주교대는 학생부교과전형을 운영하지 않으며 수시는 학생\n부종합, 정시는 수능위주로만 선발","교과 등급 위주 지원 전략은\n적용되지 않으므로 학생부\n비교과, 활동 역량 중심으로\n학생 지도"],["②\n2단계 면접 필수","• 수시·정시 모든 전형이 1단계 서류(수능)+2단계 면접의 2단\n계 전형으로 운영되며 면접 비중이 상당함(수시 30%, 정시\n10%)","서류·성적뿐 아니라 면접준비\n(교직 적성, 인성 면접 등)를\n함께 지도"],["③\n지역인재 요건","• 지역인재선발은 전북특별자치도 소재 정규 고등학교에서 고\n교 3년 전 교육과정을 이수해야 지원 가능","지역인재선발 해당 여부를\n사전에 정확히 확인하도록\n지도"],["④\n수능최저 미적용","• 수시, 정시 전 전형에서 수능최저학력기준을 적용하지 않음","최저기준 부담은 없으나\n정시는 2단계 면접(10%)이\n당락에 영향을 줄 수 있음을 안내"]],"hasHeader":true},{"type":"table","rows":[["⑤\n학폭 반영 엄격","• 학교폭력 조치사항 감점 폭이 2027학년도 대비 확대(1호 70\n→100점, 2호 105→150점, 3호 140→200점); 4~9호는 여전\n히 부적격 처리로 지원 자체가 제한됨","경미한 조치라도\n감점 폭이 크므로\n사전 안내가 필요함"],["⑥\n탐구 반영방식","• 정시 탐구영역은 사회탐구·과학탐구 2과목 평균만 반영되며\n별도 계열 구분이 없음","계열 구분 없이 탐구 2과목\n평균이 반영되므로 자유롭게\n조합 가능함을 안내"],["⑦\n영어 반영방식","• 정시 영어는 등급을 점수로 환산해 반영하며 4등급(157.5\n점)에서 5등급(112.5점) 구간의 점수 하락 폭이 큼","영어 4등급과 5등급 간 점수\n차이가 크므로 영어 등급\n관리에 특히 유의하도록 지도"],["⑧\n고른기회Ⅱ 이월","• 정시 고른기회Ⅱ(농어촌학생, 기회균형선발, 장애인등대상자)\n는 별도 정시 정원 없이 수시 정원외 미충원 인원만 이월 선\n발(만학도전형만 정시 정원 5명 별도 배정)","고른기회Ⅱ 전형은 수시 충원\n여부에 따라 정시 선발 규모가\n달라질 수 있음을 안내"]],"hasHeader":false},{"type":"note","text":"※ 본 자료는 2026년 3월 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대학 2028 학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u034","name":"군산대","region":"군산","category":"regional","categoryLabel":"지역대학","pageRange":"115~117","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 학교폭력 조치 사항 반영 강화 – 학생부종합전형의 경우 기존 1~3호 '\n감점 없음' 규정이 삭제되고, 모든 조치사항(1~7호)을 정성적으로 평\n가하여 반영(8·9호는 부적격으로 동일)",""],["수시","• 모집인원 소폭 증가(1,816명→1,858명, 수시비중 96.9%→96.7%)\n• 학생부 교과 반영 교과를 계열별 이원화에서 전 계열 공통(국어·수학·영\n어·사회·과학 이수 전 과목, 자율전공학부도 동일)으로 통합\n• 학생부교과 모집계열별 성적등급 산출방법 등 변경\n- 석차 등급 체계를 9등급제→5등급제로 전환\n- 반영 요소를 '이수단위'에서 '이수학점' 기준으로 변경\n(기준비율 10-24-32-24-10%, 누적 10-34-66-90-100%)\n• 진로선택과목 가산점(기존 최대 5점) 폐지",""],["정시","• 모집인원 소폭 증가(59명→63명, 정시 비중 3.1%→3.3%)\n• 탐구 영역 반영과목에서 직업탐구 제외, 사회탐구·과학탐구 평균만 반영\n(기존사회/과학/직업탐구 중 2과목→사회·과학으로 한정)\n• 자연과학·공학계열(해양경찰학부 제외) 과학탐구 가산점(1과목 5%, 2과목\n10%) 폐지",""]],"hasHeader":true}]},{"num":"2","title":"수시(교과,학종,논술) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","• 학생부 100% 일괄합산 / 수능최저학력기준 없음.\n• 일반전형, 지역인재Ⅰ, 지역인재Ⅱ, 저소득층학생, 농어촌학생, 특성화고교졸업자, 특성화고졸재\n직자 등 7개 세부전형 운영.\n• 반영교과 이수 전 과목의 석차등급(1~5등급)을 반영하며, 1학년~3학년 1학기까지 학년 구분 없이 동\n일 비중으로 반영(학년별 가중치 없음).\n• 학생부 요소별로는 교과성적 90%+비교과(출결)성적 10%로 산출."],["수시\n(학종)\n서류, 면접","• 일반학생 / 사회통합(국가보훈·농어촌·만학도) / 특수교육대상자 3개 전형 운영.\n• 서류평가 100%(정성평가)로 선발하며, 별도의 면접전형은 실시하지 않음.\n• 학교폭력 조치사항은 2028학년도부터 1~3호 조치도 정성적으로 평가에 반영하도록 변경(기존 '감점\n없음' 문구 삭제)."],["수시(논술)","논술전형 미실시(모집유형에 논술전형 없음)"]],"hasHeader":true}]},{"num":"3","title":"대학별 지향 인재상 및 서류 평가 요소, 권장 이수 과목","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","2028대입 시행계획에는 인재상 관련 정보가 제공되지 않음.\n(학생부교과 중심 대학으로 별도 인재상 안내 없음)"],["서류 평가\n요소","지원자 1명에 대하여 3명의 입학사정관이 지원자의 학교생활기록부를 바탕으로 공동체역량 30%(성실\n성, 책임감, 리더십, 배려/나눔, 소통/협업), 학업역량 35%(학업의지/태도, 학업성취도, 학업탐구력), 진로\n역량 35%(진로탐색/노력, 진로활동/경험, 자기주도성)에 대하여 종합적으로 평가"],["권장 이수\n과목","2028대입 시행계획에는 권장 이수과목 정보가 제공되지 않음."]],"hasHeader":true}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["정시 계열","반영 방식 및 배점","특이사항"],["인문·사회계열","• 백분위 활용 / 4개 영역 반영 – 국어 30%, 수학 20%, 영어 30%,\n탐구(사회·과학 평균) 20%","탐구 영역은\n사회·과학탐구만\n인정(직업탐구미반영)"],["자연·공학계열","• 백분위 활용(해양경찰학부 제외) / 국어 20%, 수학 30%, 영어\n30%, 탐구 20%","기존 과학탐구 가산점\n(1과목 5%, 2과목 10%)\n2028학년도부터 폐지"],["자율전공·예체능","• 자율전공학부: 국어 25%, 수학 25%, 영어 30%, 탐구 20%\n• 예·체능계열: 국어·수학 중 우수 성적 1과목 40%+영어 40%+탐구\n20%(3개 영역 반영)","영어는 등급→\n백분위 환산 반영\n(1등급100~9등급60) /\n한국사는\n정시에서만 등급별\n1~5점\n가산(수시모집은미반영)"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n반영교과 통합","• 계열 구분 없이 전 계열 공통으로 국어·수학·영어·사\n회·과학 교과 이수 전 과목을 통합 반영(2027학년도\n계열별 상이 반영에서 변경)","계열에 관계없이 5개 교과\n전체를 고르게 관리하도록 지도"],["②\n등급체계 전환","• 석차 등급 체계가 9등급제에서 5등급제로 전환\n• 반영 요소를 '이수단위'에서 '이수학점' 기준으로 변경\n(기준비율 10-24-32-24-10%, 누적 10-34-66-90-100%)","등급 구간 변화로 유불리가\n달라질 수 있어 본인의 위치를\n다시 계산해보도록 지도"]],"hasHeader":true},{"type":"table","rows":[["③\n가산점 폐지","• 진로선택과목 가산점이 2027학년도 최대 5점(A 5점·B 3\n점·C 1점)에서 2028학년도 가산점 없음으로 변경","가산점은 사라지지만 석차 등급\n자체는 계속 반영되므로\n진로선택과목의 성실한 이수는\n여전히 중요함을 안내"],["④\n탐구영역 축소","• 정시모집 탐구영역에서 직업 탐구가 제외되고 사회탐\n구·과학탐구만 인정","직업탐구 응시 예정인\n특성화고 등 학생은 정시 지원\n시 반드시 유의하도록 안내"],["⑤\n과탐 가산점 폐지","• 정시모집 자연과학·공학계열(해양경찰학부 제외) 과학\n탐구 가산점(5~10%)이 폐지","이과 계열 학생의 정시 지원\n전략을 재점검하도록 지도"],["⑥\n학폭 반영 강화","• 학생부종합전형에서 학교폭력 1~3호 조치도 정성적으로\n평가에 반영하도록 변경\n(기존 '감점없음'에서 변경)","경미한 학교폭력 조치라도\n학생부종합전형 지원 시\n불이익 가능성이 있음을 사전\n안내"],["⑦ 지역인재 대상","• 지역인재Ⅰ·Ⅱ전형은 호남권(전북특별자치도·전라남도\n광주광역시) 소재 고교에서 전 교육과정을 이수한 자\n를 대상으로 하며, 간호학부 지원자는 중학교 재학 요\n건이 추가로 적용됨","지역인재 전형 해당 여부를\n사전에 정확히 확인하도록\n지도"],["⑧ 반영·출결","• 학년별 반영 비율은 1학년~3학년 1학기까지 가중치\n없이 동일하게 반영되며, 학생부 요소는 교과성적 90%+\n출결 10%로 산출","학년이 올라가도\n이전 학년성적의 반영 비중이\n줄지 않으므로, 전 학년에 걸쳐\n꾸준한 관리가 필요하며 출결\n관리도 소홀히 하지 않도록 지도"]],"hasHeader":false},{"type":"note","text":"※ 본 자료는 2026년 4월 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대학 2028 학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u035","name":"우석대","region":"완주","category":"regional","categoryLabel":"지역대학","pageRange":"118~119","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 지역인재전형 지원자격 : 중학교 소재지 및 거주지 적용\n• 진로선택과목 가산점폐지\n• 취득학점(이수단위)에 따른 가산점 부여\n• 수학, 과학 교과이수자 가산점 부여",""],["수시","• 전체 모집단위(한의예, 한약학, 약학 제외)\n국어, 수학, 영어, 사회(역사/도덕포함),과학 교과 중 상위 15개과목반영\n• 한의예, 한약학, 약학\n국어, 수학, 영어, 사회(역사/도덕포함), 과학 교과 중 전 과목 반영\n• 학생부 교과(교과면접)\n- 1단계 : 교과성적90% + 출결10%\n- 2단계 : 1단계 성적 70%, 면접 30%\n- 1단계 배수 선발 : 일반(지원자전체)/ 보건, 의약계열(6배수)\n• 수능최저적용\n- 간호학과, 약학과, 한약학과, 한의예과","[한의예, 한약학, 약학]\n* 가산점 : 총 취득학점,\n수학 및 과학교과 가산점\n[보건,의약계열]\n간호, 물리치료,약학,\n한약학,한의예\n[교과면접 간호학과]\n수능최저 미적용"],["정시","• 간호학과 : 국, 수, 영 중 2과목 + 사/과 중 1과목(3과목 반영)\n• 약학, 한의예, 한약학과 : 국, 수, 영, 사/과 중 4과목 반영\n• 간호, 약학, 한의예, 한약학과를 제외한 모든 교과는 정시 지원 시 학생\n부 교과 성적 반영\n(국어, 수학, 영어, 사회(역사/도덕포함), 과학 교과 중 상위 15개 과목)","수능 수학 가산점폐지\n(2022개정교육과정\n선택과목 폐지)"]],"hasHeader":true}]},{"num":"2","title":"수시(교과) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","【지역인재1】(전북권) : 한의예과, 약학과\n【지역인재2】(호남권) : 한의예과, 약학과, 간호학과\n(비수도권) : 한약학과\n【지역인재-기회균형】(호남권) : 한의예과, 약학과, 간호학과\n(비수도권) : 한약학과"],["","【수능최저학력기준】\n모집단위 전형유형 최저학력기준\n• 전체 전형\n국, 수, 영, 탐(사회/과학) 중 2개 합 11이내\n간호학과 - 교과면접전형\n(* 탐구는 1과목 반영)\n수능 최저 미적용\n• 교과면접\n• 지역인재1, 2 국, 수, 영, 탐(과학) 중 3개 합이 6이내 (* 수학 포함)\n약학과 • 일반학생(수능위주)\n• 지역인재(기회균형)\n국, 수, 영, 탐(과학) 중 3개 합이 7이 (* 수학 포함)\n• 정원외 전체\n한약학과 • 전체 전형 국, 수, 영, 탐(과학) 중 3개 합이 9이내\n• 교과면접\n국, 수, 영, 탐(사회/ 과학) 중 3개 합이 6이내\n• 지역인재1, 2\n(* 탐구는 2과목 평균/ * 수학 포함)\n• 일반학생(수능위주)\n한의예과\n• 지역인재(기회균형) 국, 수, 영, 탐(사회/ 과학) 중 3개 합이 7이내\n• 정원외 전체 (* 탐구 1과목/ * 수학 포함)"]],"hasHeader":true}]},{"num":"3","title":"대학별 평가 요소","blocks":[{"type":"table","rows":[["구분","주요 내용",""],["교과면접","[1단계]\n일반학과 : 전체 / 보건, 의약 : 6배수","[2단계]\n1단계 70% + 면접 30%"]],"hasHeader":true}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["수능 유형","반영 방식 및 배점","특이사항"],["①\n일반학생","- 간호학과 :\n국어, 수학, 영어 3개 영역 중 상위 2개 (35%씩), 탐구 1과목 (30%)\n- 약학과, 한약학과, 한의예과\n국어(20%), 수학(30%), 영어(20%), 탐구 2과목 평균(30%)","백분위"],["②\n가산점","[약학과, 한의예과, 한약학과]\n5점 - 주요 교과목(국어, 영어, 수학, 사회, 과학)의 학점 합이 90이상\n일 경우 가산점 부여(석차 등급 없는 과목도 반영)\n* 수학, 과학 교과 이수자 가산점\n5점 - 수학 : 미적분Ⅰ,Ⅱ 또는 기하\n(이수한 전체 교과목 중 해당 교과목 이수자)\n5점 - 과학 : 과학 교과(해당 되는 모든 과목 공통, 선택과목인정)\n(총 22학점 이수자)","가산점 조건에 해당되는\n학생의 경우 총 15점의\n가산점을 받을 수 있음."]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n수능최저적용","간호학과, 약학과, 한약학과, 한의예과\n(교과 면접 중 간호학과는 제외)","수능최저준비강화"],["②\n약학과, 한의예과\n한약학과","가산점 적용\n가산점 취득 여부 확인","해당 되는 내용이 없을 경우 주의"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u036","name":"원광대","region":"익산","category":"regional","categoryLabel":"지역대학","pageRange":"120~122","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["공통","• 의ㆍ약학계열에서 한의예과(인문), 치의예과(인문) 모집단위를 폐지하고\n통합선발함.\n• 수시 학생부위주 교과전형의 성적 산출 방식이 9등급제에서 5등급제\n변화에 맞춰 변경됨.\n• 학교폭력 조치사항은 수시·정시 전형 전반에 반영되며, 전형 유형별로\n감점 또는 부적격 처리 기준이 다름.","의약학계열 지원자는\n더 이상 인문 별도 모집\n단위가 없다는 점 확인"],["수시","① 학생부종합전형은 일반학과는 서류 100% 일괄합산, 원불교학과 및\n의예과ㆍ치의예과ㆍ한의예과ㆍ약학과ㆍ한약학과는 단계별 전형으로 운영함.\n② 지역인재종합전형은 전북권과 호남권으로 지역을 구분하여 모집하며,\n의약학계열과 간호학과는 중학교 재학 및 거주 요건도 확인해야 함.\n③ 지역인재기회균형전형은 호남권 고교 이수자 중 기초생활수급자, 차상\n위계층, 한부모가족 지원대상자를 대상으로 함.\n④ 지역의사선발전형은 의예과에서 21명을 선발하며, 전주권ㆍ군산권ㆍ\n익산권ㆍ정읍권ㆍ남원권ㆍ광역권으로 나누어 모집함.\n⑤ 학생부교과 일반전형은 간호학과에만 수능최저학력기준을 적용하고,\n지역인재교과전형은 의예과ㆍ치의예과ㆍ한의예과 및 간호학과에 수능\n최저학력기준을 적용함.","의약학계열은 전형별\n수능최저와 지역 자격이\n세분화되어 있으므로\n전형명별로 구분해 지도"],["정시","① 정시 수능 성적 활용지표가 표준점수에서 백분위로 변경됨.\n② 정시 수능위주전형은 수능 100%에서 수능 80% + 학생부 정량평가 20%로\n변경됨.\n③ 국어 20%, 수학 20%, 탐구 20%, 영어 20%, 학생부 정량평가 20%\n구조로 반영하며, 한국사는 가산점으로 반영함.\n④ 의예과ㆍ치의예과ㆍ한의예과ㆍ약학과는 수능 1개 영역이라도 미응시\n하는 경우 불합격 처리함.","수능만으로 판단하기\n어렵고 학생부 정량평가\n20%가 반영됨.\n의약학계열은 수능 응시\n영역 누락 여부를 특히\n주의"]],"hasHeader":true}]},{"num":"2","title":"수시(교과, 학종) 전형소개","blocks":[{"type":"table","rows":[["구분","주요 내용"],["수시(교과)","【학생부교과(일반전형)】 국내 고교 졸업(예정)자 또는 동등 학력 인정자가 지원 가능하며, 교과성적\n590점과 출결 10점을 합산한 학생부 100% 일괄 합산 전형임.\n간호학과만 수능최저학력기준을 적용하며, 국어ㆍ수학ㆍ영어ㆍ통합사회/통합과학 중 상위 3개 영역 등\n급 합 13 이내, 한국사 필수 응시 조건이 있음.\n【학생부교과(지역인재교과전형)】 전북 또는 호남권 소재 동일 지역 고교에서 전 교육과정을 이수한 졸\n업(예정)자가 지원 가능함.\n의예과ㆍ치의예과ㆍ한의예과ㆍ약학과ㆍ한약학과ㆍ간호학과 지원자는 2022학년도 이후 중학교 입학자\n부터 중학교 재학 및 거주 요건도 확인해야 함.\n학생부 100%로 선발하며, 의예과ㆍ치의예과·한의예과는 수학 포함 3개 영역 등급합 5 이내, 간호학과\n는 상위 3개 영역 등급합 13 이내를 적용함.\n【학생부교과(고른기회전형)】 국가보훈대상자, 만학도, 서해5도, 장애인 등 대상자, 자립지원 대상 아동,\n북한이탈주민 등을 대상으로 하며, 수능 최저 없이 학생부 100%로 선발함.\n【학생부교과(특성화고교졸업자전형)】 특성화고 졸업(예정)자를 대상으로 하며, 모집단위와 동일계열로\n인정되는 경우 지원 가능함. 기준학과가 다르더라도 모집단위 관련 전문교과를 24학점 이상 이수한\n경우 지원 가능하며, 수능 최저는 없음."]],"hasHeader":true},{"type":"table","rows":[["수시\n(학종)\n서류, 면접","【학생부종합전형】 일반학과는 서류 100% 일괄합산으로 선발함.\n원불교학과와 의예과ㆍ치의예과ㆍ한의예과ㆍ약학과ㆍ한약학과\n1단계 서류 100%/ 2단계 1단계 성적 70% + 면접 30%로 선발.\n* 수능최저\n의예과ㆍ치의예과ㆍ한의예과 : 수학 포함 3개 영역 등급 합 6 이내, 약학과 : 7 이내,\n한약학과 : 상위 3개 영역 9 이내, 간호학과는 : 상위 3개 영역 13 이내\n【지역인재종합전형】 전북 또는 호남권 소재 동일 지역 고교 전 교육과정 이수자가 지원 가능함.\n일반학과 : 서류 100%, 의약학계열 : 1단계 서류 100%, 2단계 1단계 성적 70% + 면접 30%선발\n* 수능최저\n의예과ㆍ치의 의예과ㆍ치의예과ㆍ한의예과 : 수학 포함 3개 영역 등급 합 6, 약학과 : 7 이내\n한약학과 : 상위 3개 영역 9, 간호학과 : 상위 3개 영역 13\n【지역인재기회균형전형】 호남권 고교 전 교육과정 이수자 중 기초생활수급자, 차상위계층, 한부모가족\n지원 대상자 등이 지원 가능함. 간호학과는 서류 100%, 의약학계열은 단계별 전형으로 선발함.\n의예과ㆍ치의예과ㆍ한의예과는 수학 포함 3개 영역 등급 합 7 이내, 약학과는 8 이내,\n한약학과는 상위 3개 영역 10 이내, 간호학과는 상위 3개 영역 14 이내를 적용함.\n【지역의사선발전형】 의예과 전형으로, 중·고교 재학 및 거주 요건을 충족한 학생 중 복무형 지역의사\n가 되려는 학생이 지원 가능함.\n총 21명을 선발하며 전주권(9명), 군산권(1명), 익산권(1명), 정읍권(2명), 남원권(2명), 광역권(6명)으로\n구분함.\n수능최저는 수학 포함 3개 영역 등급 합 6 이내,\n1단계 서류 100%, 2단계 1단계 성적 60% + 면접 40%로 선발함.\n【기회균형전형】 기초생활수급자, 차상위계층, 한부모가족 지원대상자 등을 대상으로 함.\n일반학과는 서류 100%, 의ㆍ약학계열은 단계별 전형으로 선발하며, 수능 최저는 없음.\n【농어촌학생전형】 농어촌지역 또는 도서·벽지 지역에서 중·고교 전 과정을 이수하고 본인 및 부모가\n거주한 유형Ⅰ, 또는 초·중·고 전 과정을 이수하고 본인이 거주한 유형Ⅱ 중 하나를 충족해야 함.\n특목고와 검정고시는 제외됨. 일반학과는 서류 100%, 의약학계열은 단계별 전형으로 선발하며, 수능\n최저는 없음."]],"hasHeader":false}]},{"num":"3","title":"대학별 지향 인재상","blocks":[{"type":"table","rows":[["구분","주요 내용"],["인재상","핵심 키워드 : 덕성, 창의, 소통, 실천 (출처 : 대학 홈페이지)\n① 창의역량 : 자신을 존중하고 타인을 배려하며 봉사를 실천하는 역량\n② 창의역량 : 비판적 분석능력으로 문제를 해결하고 새로운 생각으로 가치를 만들어내는 역량\n③ 소통역량 : 합리적 이성과 공감적 감성을 통해 타인을 이해하고 민주적으로 소통하는 역량\n④ 실천역량 : 목표를 달성하기 위해 끝까지 노력하고 자신을 개발하여 도전적으로 미래를 개척하는\n역량"]],"hasHeader":true}]},{"num":"4","title":"정시 모집 주요 안내","blocks":[{"type":"table","rows":[["수능 유형","반영 방식 및 배점","특이사항"],["정시\n수능(일반전형)","수능 80% + 학생부 정량평가 20% 반영.\n수능은 국어, 수학, 탐구, 영어를 각 20%씩 반영하고\n한국사는 가산점으로 반영함.","정시 : 학생부 정량평가\n내신과 출결 관리 필요"],["정시\n수능(지역의사선발)","수시 미충원 발생 시 의예과에서 선발.\n수능 80% + 학생부 20% 반영,\n수능 1개 영역이라도 미응시하면 불합격 처리함.","이월 여부, 중ㆍ고교 재학\n및 거주 요건, 의무복무 조\n건 확인 필요"],["정시\n수능(군사학과전형)","1단계 : 수능 700점으로(5배수)\n2단계에서 1단계 성적 + 면접 200점 + 체력검정 100점 반영.\n국어ㆍ수학ㆍ영어 각 33.3%, 탐구 미반영.","육군본부 지침에 따라 변경\n가능. 군 가산복무 지원금\n조건 확인 필요"]],"hasHeader":true}]},{"num":"5","title":"학생 지도 시 반드시 체크해야 할 핵심 포인트","blocks":[{"type":"table","rows":[["체크 항목","주의 내용","지도 방향"],["①\n의약학계열\n인문 모집단위 폐지","한의예과(인문), 치의예과(인문) 모집 단위가 폐지되고\n통합선발로 변경됨.","기존 인문 모집단위 기준으로 지원 전략\n을 세우지 않도록 안내하고, 수학·과학\n기반 준비 필요성을 설명"],["②\n지역인재\n자격 구분","지역인재 종합ㆍ지역인재 교과는 전북 또는 호남권 동일\n지역 고교 이수 요건이 있음. 의약학계열ㆍ간호학과는\n중학교 재학 및 거주 요건도 확인 필요","전북권·호남권 구분, 고교 이수 지역, 중\n학교 소재와 거주 요건을 조기 확인"],["③\n지역의사선발\n전형","의예과 21명을 권역별로 선발하며, 수학 포함 3개 영역\n등급 합 6 이내를 적용함.","지원 자격, 진료권별 거주 요건, 복무형\n지역의사 의무복무 조건을 함께 안내"],["④\n의약학계열\n수능 최저 차이","전형별로 의예과ㆍ치의예과ㆍ한의예과ㆍ약학과ㆍ한약학과의\n수능 최저가 다름.","전형명별 수능최저를 따로 확인하고, 수\n학 포함 조건 여부를 중점 점검"],["⑤\n간호학과\n수능최저","교과 일반ㆍ지역인재 교과는 상위 3개 영역 등급 합 13\n이내, 지역 인재기회균형은 14 이내 적용","교과 성적과 함께 수능최저 충족 가능성\n을 판단"],["⑥\n정시 학생부\n20% 반영","정시 수능 위주 전형이 수능 80% + 학생부 정량평가 20%로\n변경됨.","정시 지원자도 내신과 출결 관리 필요.\n미인정 결석 반영에 유의"],["⑦\n정시 수능\n활용지표 변경","정시 수능 성적 활용지표가 표준점수에서 백분위로 변\n경됨.","기존 표준점수 중심 판단이 아니라 백분\n위 기준으로 유불리 재검토"],["⑧\n정시 의약학계열\n응시영역 누락\n주의","의예과ㆍ치의예과ㆍ한의예과ㆍ약학과는 수능 1개 영역\n이라도 미응시하면 불합격 처리됨.","응시영역 누락 여부와 통합사회ㆍ통합과학\n평균 반영 구조를 반드시 확인"]],"hasHeader":true},{"type":"note","text":"※ 본 자료는 2026년 4월 30일 발표 기준이며, 관련 법령 변경 및 입시 여건에 따라 수정될 수 있습니다. 반드시 해당 대 학 2028학년도 최종 전형 요강을 확인하시기 바랍니다."}]}],"trailingNotes":[]},{"id":"u037","name":"전주대","region":"전주","category":"regional","categoryLabel":"지역대학","pageRange":"123~124","sections":[{"num":"1","title":"2027 대비 2028 주요 변경 사항","blocks":[{"type":"table","rows":[["구분","주요 내용 및 변경 핵심","비고"],["수시","• 학생부 교과전형 : 학생부 성적산출방법 변경\n학생부 100% → 학생부 90% + 출결 10%\n• 달란트전형 : 학생부 90% + 출결 10%\n학생부 반영 세부사항\n1학년 : 국어, 수학, 영어, 사회(한국사포함), 과학 공통교과 30%\n2~3학년 : 국어, 수학, 영어, 사회(한국사포함), 과학\n일반선택/진로선택/융합선택 과목 중 원점수 상위 10과목 70%\n• 신설 - 학생부교과(미래인재전형) : 수능최저적용\n반영방법은 타전형과 동일 (학생부90% + 출결 10%)","교과 미래인재전형(30명)\n수능최저적용 const CATEGORY_ORDER = ["seoul","national","regional"];
const CATEGORY_LABEL = {seoul:"서울지역대학", national:"국가거점국립대학", regional:"지역대학"};

let state = { query: "", category: "all", selectedId: null };

const el = (sel) => document.querySelector(sel);
const els = (sel) => Array.from(document.querySelectorAll(sel));

function esc(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const RED_OPEN = "\uE000", RED_CLOSE = "\uE001";
const SUBTABLE_MARK = "\uE010";
function escHL(s){
  return esc(s).split(RED_OPEN).join('<span class="hl-red">').split(RED_CLOSE).join('</span>');
}
function stripMarkers(s){
  return (s||"").split(RED_OPEN).join("").split(RED_CLOSE).join("");
}

function filteredList(){
  return DATA.filter(u => {
    if(state.category !== "all" && u.category !== state.category) return false;
    if(state.query){
      const q = state.query.trim();
      if(!(u.name.includes(q) || u.region.includes(q))) return false;
    }
    return true;
  });
}

function renderChips(){
  const wrap = el("#filterChips");
  const counts = {all: DATA.length};
  CATEGORY_ORDER.forEach(c => counts[c] = DATA.filter(u=>u.category===c).length);
  const chips = [["all","전체"], ...CATEGORY_ORDER.map(c=>[c, CATEGORY_LABEL[c]])];
  wrap.innerHTML = chips.map(([key,label]) => `
    <button class="chip ${state.category===key?'active':''}" data-cat="${key}">${label} · ${counts[key]}</button>
  `).join("");
  els(".chip").forEach(b => b.addEventListener("click", () => {
    state.category = b.dataset.cat;
    renderChips();
    renderList();
  }));
}

function renderList(){
  const wrap = el("#listScroll");
  const list = filteredList();
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty-list">검색 결과가 없습니다.<br>다른 대학명을 입력해보세요.</div>`;
    return;
  }
  let html = "";
  let lastCat = null;
  list.forEach(u => {
    if(state.category === "all" && u.category !== lastCat){
      html += `<div class="group-label">${u.categoryLabel}</div>`;
      lastCat = u.category;
    }
    html += `
      <button class="univ-btn ${state.selectedId===u.id?'active':''}" data-id="${u.id}">
        <span>
          <span class="name">${u.name}</span>
          <div class="region">${u.region}</div>
        </span>
        <span class="pages-badge">${u.sections.length}개 항목</span>
      </button>
    `;
  });
  wrap.innerHTML = html;
  els(".univ-btn").forEach(b => b.addEventListener("click", () => selectUniv(b.dataset.id)));
}

function selectUniv(id){
  state.selectedId = id;
  renderList();
  renderMain();
  closeSidebarMobile();
}
